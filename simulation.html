<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Conjunction CSV Inspector</title>

  <!-- PapaParse (for worker-based streaming CSV parsing) -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    :root {
      --bg-main: #0b1020;
      --bg-panel: #121a33;
      --bg-table-header: #1b254b;
      --border-soft: #26346b;
      --text-main: #e6ebff;
      --text-muted: #9aa4d6;
      --accent: #6ea8ff;
      --accent-glow: rgba(110,168,255,0.45);
    }

    body {
      margin: 0;
      padding: 28px;
      font-family: Inter, Segoe UI, Arial, sans-serif;
      background:
        radial-gradient(circle at 20% 15%, #1a2458 0%, transparent 40%),
        radial-gradient(circle at 80% 10%, #101a40 0%, transparent 45%),
        linear-gradient(180deg, #050816 0%, var(--bg-main) 100%);
      color: var(--text-main);
      min-height: 100vh;
    }

    h1 {
      font-size: 26px;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 22px;
    }

    .section {
      margin-bottom: 36px;
    }

    .panel {
      background: var(--bg-panel);
      border: 1px solid var(--border-soft);
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 0 28px rgba(0,0,0,0.45);
    }

    input {
      width: 420px;
      max-width: 100%;
      padding: 10px 14px;
      font-size: 14px;
      border-radius: 8px;
      border: 1px solid var(--border-soft);
      background: #0c1330;
      color: var(--text-main);
      outline: none;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-glow);
    }

    .status {
      margin-top: 10px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .table-wrapper {
      margin-top: 16px;
      height: 420px;
      overflow: auto;
      border: 1px solid var(--border-soft);
      border-radius: 10px;
    }

    table {
      border-collapse: collapse;
      width: max-content;
      min-width: 100%;
      font-size: 13px;
    }

    th, td {
      padding: 9px 12px;
      border-bottom: 1px solid var(--border-soft);
      white-space: nowrap;
    }

    th {
      position: sticky;
      top: 0;
      background: var(--bg-table-header);
      color: var(--accent);
      z-index: 2;
    }

    tbody tr:hover {
      background: rgba(110,168,255,0.06);
    }

    .image-section {
      text-align: center;
    }

    .image-section img {
      max-width: 900px;
      width: 95%;
      opacity: 0.7;
      border-radius: 16px;
      box-shadow:
        0 0 40px rgba(110,168,255,0.18),
        0 0 90px rgba(0,0,0,0.6);
    }

    .image-caption {
      margin-top: 10px;
      font-size: 12px;
      color: var(--text-muted);
    }
  </style>
</head>

<body>

<h1>Conjunction CSV Inspector</h1>
<div class="subtitle">
  Worker-based CSV streaming · Virtualized rendering · Analyst-ready
</div>

<div class="section">
  <div class="panel">
    <input
      id="searchInput"
      type="text"
      placeholder="Search across conjunction ID, object names, probability…"
      disabled
    />

    <div class="status" id="status">Streaming CSV in background…</div>

    <div class="table-wrapper" id="tableWrapper">
      <table>
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<div class="section image-section">
  <div class="section-title">Dataset Visualization</div>

  <img
    src="https://raw.githubusercontent.com/orbitorus/orbit-i-beta/main/sim_dataset/cpmd_risk_zones.png"
    alt="conjunction context visualization"
  />

  <div class="image-caption">
    Example orbital geometry / conjunction visualization
  </div>
</div>

<script>
  const CSV_URL =
    "https://raw.githubusercontent.com/orbitorus/orbit-i-beta/main/sim_dataset/selected_conjunction_data.csv";

  const searchColumns = [
    "conjunction_id",
    "object1_object_name",
    "object2_object_name",
    "object1_catalog_name",
    "object2_catalog_name",
    "object1_object_designator",
    "object2_object_designator"
  ];

  const floatCols = [
    "miss_distance",
    "relative_speed",
    "collision_probability"
  ];

  let rows = [];
  let filtered = [];
  let columns = [];
  const ROW_HEIGHT = 34;
  const tbody = document.getElementById("tbody");
  const thead = document.getElementById("thead");
  const wrapper = document.getElementById("tableWrapper");
  const status = document.getElementById("status");
  const searchInput = document.getElementById("searchInput");

  function renderHeader() {
    thead.innerHTML =
      "<tr>" + columns.map(c => `<th>${c}</th>`).join("") + "</tr>";
  }

  function renderVisibleRows() {
    const scrollTop = wrapper.scrollTop;
    const height = wrapper.clientHeight;
    const start = Math.floor(scrollTop / ROW_HEIGHT);
    const end = Math.min(start + Math.ceil(height / ROW_HEIGHT) + 5, filtered.length);

    tbody.innerHTML = "";
    tbody.style.height = filtered.length * ROW_HEIGHT + "px";

    for (let i = start; i < end; i++) {
      const tr = document.createElement("tr");
      tr.style.position = "absolute";
      tr.style.top = i * ROW_HEIGHT + "px";

      columns.forEach(col => {
        let val = filtered[i][col] ?? "";
        if (floatCols.includes(col) && val !== "") {
          val = Number(val).toPrecision(4);
        }
        tr.innerHTML += `<td>${val}</td>`;
      });

      tbody.appendChild(tr);
    }
  }

  function applyFilter(term) {
    const q = term.toLowerCase();
    filtered = rows.filter(r =>
      searchColumns.some(c => (r[c] || "").toLowerCase().includes(q))
    );
    status.textContent = `Matches: ${filtered.length}`;
    wrapper.scrollTop = 0;
    renderVisibleRows();
  }

  // ===== FIX 1: Worker-based streaming parse =====
  Papa.parse(CSV_URL, {
    download: true,
    header: true,
    worker: true,
    skipEmptyLines: true,
    step: function (result) {
      rows.push(result.data);
    },
    complete: function () {
      columns = Object.keys(rows[0] || {});
      filtered = rows;

      renderHeader();
      renderVisibleRows();

      searchInput.disabled = false;
      status.textContent = `Loaded ${rows.length} conjunctions`;
    }
  });

  wrapper.addEventListener("scroll", renderVisibleRows);

  searchInput.addEventListener("input", e => {
    applyFilter(e.target.value);
  });
</script>

</body>
</html>
