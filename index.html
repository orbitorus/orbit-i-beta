<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Satellite Constellations Overview</title>
  <style>
    body { 
      margin: 0; 
      background: black; 
      font-family: 'Segoe UI', Roboto, sans-serif; 
      color: white; 
      overflow-x: hidden;
    }
    /* Top banner */
    #top-banner {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 50px;
      background: rgba(40, 40, 40, 0.95);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 20px;
      z-index: 20;
      font-size: 20px;
      font-weight: bold;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
    }
    #top-banner span { flex-shrink: 0; }
    #top-banner button, #top-banner a {
      background-color: #1e90ff;
      border: none;
      color: white;
      padding: 6px 14px;
      font-size: 14px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
      text-decoration: none;
    }
    #top-banner select {
      background-color: #222;
      color: white;
      border: 1px solid #555;
      padding: 5px 10px;
      font-size: 14px;
      border-radius: 4px;
      cursor: pointer;
    }

    #info-banner {
      position: fixed;
      top: 50px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 900px;
      background: linear-gradient(90deg, rgba(50,50,50,0.9), rgba(20,20,20,0.9));
      color: #e0e0e0;
      text-align: center;
      padding: 14px 20px;
      font-size: 15px;
      border-radius: 8px;
      margin-top: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      opacity: 0;
      z-index: 30;
      transition: opacity 0.8s ease, transform 0.8s ease;
      backdrop-filter: blur(4px);
    }
    #info-banner.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #info-banner.hide { opacity: 0; transform: translateX(-50%) translateY(-10px); }

    #loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(40,40,40,0.9);
      padding: 15px 25px;
      border-radius: 8px;
      font-size: 15px;
      text-align: center;
      display: none;
      z-index: 1000;
      width: 250px;
      box-shadow: 0 0 12px rgba(0,0,0,0.5);
    }
    #loading-bar {
      width: 100%;
      height: 8px;
      background: rgba(255,255,255,0.1);
      border-radius: 4px;
      overflow: hidden;
      margin-top: 10px;
    }
    #loading-progress {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #1e90ff, #63b3ff);
      transition: width 0.3s ease;
    }

    #chart { 
      width: 100%; 
      height: 100vh; 
      margin-top: 50px; 
      position: absolute;
      top: 50px;
      left: 0;
    }

    #side-panel {
      position: fixed;
      top: 50px;
      right: 0;
      width: 50%;
      height: calc(100% - 50px);
      background: rgba(20, 20, 20, 0.8);
      transform: translateX(100%);
      transition: transform 0.5s ease;
      padding: 20px;
      box-shadow: -4px 0 12px rgba(0, 0, 0, 0.5);
      z-index: 2000;
      overflow: auto;
    }
    #side-panel.active { transform: translateX(0); }
    #side-panel iframe { width: 100%; height: 100%; border: none; }

    #left-panel {
      position: fixed;
      top: 50px;
      left: 0;
      width: 35%;
      height: calc(100% - 50px);
      background: rgba(20, 20, 20, 0.8);
      transform: translateX(-100%);
      transition: transform 0.5s ease;
      padding: 20px;
      box-shadow: 4px 0 12px rgba(0,0,0,0.5);
      z-index: 1500;
      overflow: auto;
    }
    #left-panel.active { transform: translateX(0); }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/globe.gl"></script>
</head>
<body>
  <div id="top-banner">
    <span>Major LEO Constellation Visualization</span>
    <button id="anomalous-btn">Show Apparent Anomalous Satellites</button>
    <select id="constellation-select">
      <option value="all">🌐 All Active Satellites</option>
      <option value="oneweb">🇬🇧 OneWeb</option>
      <option value="kuiper">🇺🇸 Kuiper</option>
      <option value="starlink">🇺🇸 Starlink</option>
      <option value="iridium-NEXT">🇺🇸 Iridium-NEXT</option>
      <option value="hulianwang">🇨🇳 Hulianwang</option>
      <option value="qianfan">🇨🇳 Qianfan</option>
      <option value="planet">🇺🇸 Planet</option>
    </select>
    <button id="orbit-btn" disabled>Orbit Analysis</button>
  </div>

  <div id="info-banner">
    This website helps you find apparent anomalous satellites from major mega constellations.<br>
    Select a constellation from the drop-down list.
  </div>

  <div id="loading" aria-hidden="true">
    <div id="loading-text">Loading satellites... <span id="loading-percent">0%</span></div>
    <div id="loading-bar"><div id="loading-progress"></div></div>
  </div>

  <div id="chart"></div>

  <div id="side-panel">
    <iframe id="orbitLink" src=""></iframe>
  </div>

  <div id="left-panel">
    <div id="left-panel-content"></div>
  </div>

  <script type="module">
    import * as satellite from 'https://esm.sh/satellite.js';

    const chart = document.getElementById("chart");
    const orbitBtn = document.getElementById("orbit-btn");
    const anomalousBtn = document.getElementById("anomalous-btn");
    const selectEl = document.getElementById("constellation-select");
    const sidePanel = document.getElementById("side-panel");
    const leftPanel = document.getElementById("left-panel");
    const leftPanelContent = document.getElementById("left-panel-content");
    const orbitLink = document.getElementById("orbitLink");

    const loading = document.getElementById("loading");
    const loadingPercent = document.getElementById("loading-percent");
    const loadingProgress = document.getElementById("loading-progress");

    const infoBanner = document.getElementById('info-banner');
    window.addEventListener("load", () => {
      infoBanner.classList.add("show");
      setTimeout(() => { infoBanner.classList.add("hide"); setTimeout(() => infoBanner.style.display="none",800); }, 5000);
    });

    const TLE_URLS = {
      starlink: 'https://celestrak.org/NORAD/elements/gp.php?GROUP=starlink&FORMAT=tle',
      kuiper: 'https://celestrak.org/NORAD/elements/gp.php?GROUP=kuiper&FORMAT=tle',
      oneweb: 'https://celestrak.org/NORAD/elements/gp.php?GROUP=oneweb&FORMAT=tle',
      "iridium-NEXT": 'https://celestrak.org/NORAD/elements/gp.php?GROUP=iridium-NEXT&FORMAT=tle',
      hulianwang: 'https://celestrak.org/NORAD/elements/gp.php?GROUP=hulianwang&FORMAT=tle',
      qianfan: 'https://celestrak.org/NORAD/elements/gp.php?GROUP=qianfan&FORMAT=tle',
      planet: 'https://celestrak.org/NORAD/elements/gp.php?GROUP=planet&FORMAT=tle'
    };

    const EARTH_RADIUS_KM = 6371;
    const TIME_STEP = 1000;
    let satDataMap = {};
    let activeConstellation = "all";
    let time = new Date();

    const world = Globe()(chart)
      .globeImageUrl('//cdn.jsdelivr.net/npm/three-globe/example/img/earth-night.jpg')
      .backgroundColor('#000')
      .showAtmosphere(true)
      .atmosphereColor('rgba(70,120,180,0.3)')
      .particleLat('lat')
      .particleLng('lng')
      .particleAltitude('alt')
      .particlesColor(()=>'rgba(255,255,200,1)');

    setTimeout(() => world.pointOfView({ altitude: 3.5 }));

    function showLoadingUI() { loading.style.display="block"; setLoadingPercent(0); }
    function hideLoadingUI() { loading.style.display="none"; setLoadingPercent(0); }
    function setLoadingPercent(p) { const clamped=Math.min(100,Math.max(0,p)); loadingPercent.textContent=clamped+"%"; loadingProgress.style.width=clamped+"%"; }

    async function fetchConstellation(name, progressCallback){
      if(!name || satDataMap[name]) return;
      try{
        const res = await fetch(TLE_URLS[name]);
        const raw = await res.text();
        const tleData = raw.replace(/\r/g,'').split(/\n(?=[^12])/).filter(d=>d).map(tle=>tle.split('\n'));
        const sats = tleData.map(([nm,...tle])=>({satrec: satellite.twoline2satrec(...tle), name: nm?.trim?.()||'unknown'}));
        satDataMap[name] = sats;
        if(progressCallback) progressCallback();
      }catch(e){ console.error("Error fetching constellation", name, e); }
    }

    async function fetchAllConstellations(){
      showLoadingUI();
      const names = Object.keys(TLE_URLS);
      let completed=0;
      const total = names.length;
      await Promise.all(names.map(n=>fetchConstellation(n,()=>{completed++; setLoadingPercent(Math.round(completed/total*100));})));
      setTimeout(()=>hideLoadingUI(), 300);
    }

    function updateSatPositions(){
      time = new Date(+time + TIME_STEP);
      const gmst = satellite.gstime(time);
      Object.values(satDataMap).flat().forEach(d=>{
        const eci = satellite.propagate(d.satrec,time);
        if(eci?.position){
          const gd = satellite.eciToGeodetic(eci.position, gmst);
          d.lat = satellite.radiansToDegrees(gd.latitude);
          d.lng = satellite.radiansToDegrees(gd.longitude);
          d.alt = gd.height/EARTH_RADIUS_KM;
        }else{ d.lat=d.lng=d.alt=NaN; }
      });
      updateParticleDataForActive();
    }

    function updateParticleDataForActive(){
      let activeData = activeConstellation==="all"? Object.values(satDataMap).flat() : satDataMap[activeConstellation]||[];
      activeData = activeData.filter(d=>typeof d.lat==='number' && typeof d.lng==='number');
      world.particlesData(activeData);
    }

    function frameTicker(){ requestAnimationFrame(frameTicker); updateSatPositions(); }

    // Start everything after loading satellites
    async function start(){
      await fetchAllConstellations();
      frameTicker();
    }
    start();

    selectEl.addEventListener("change", async e=>{
      activeConstellation=e.target.value;
      orbitBtn.disabled = activeConstellation==="all";
      updateParticleDataForActive();
    });

    orbitBtn.addEventListener("click", e=>{
      if(activeConstellation==="all") return;
      sidePanel.classList.toggle("active");
      orbitLink.src = `${activeConstellation}/index3.html`;
      world.pointOfView({ lat:0,lng:-20,altitude:3.2 },1000);
    });

    anomalousBtn.addEventListener("click", async e=>{
      e.stopPropagation();
      leftPanel.classList.toggle("active");
      if(leftPanel.classList.contains("active")){
        try{
          const res = await fetch("left_panel.html");
          if(!res.ok) throw new Error("Failed to load left_panel.html");
          const htmlText = await res.text();
          leftPanelContent.innerHTML = htmlText;
          const scripts = leftPanelContent.querySelectorAll("script");
          scripts.forEach(oldScript=>{
            const newScript=document.createElement("script");
            if(oldScript.src) newScript.src=oldScript.src; else newScript.text=oldScript.textContent;
            document.body.appendChild(newScript);
            oldScript.remove();
          });
        }catch(err){
          leftPanelContent.innerHTML="<p style='color:red;'>⚠️ Could not load left_panel.html</p>";
          console.error(err);
        }
      }else{ leftPanelContent.innerHTML=""; }
    });

    document.addEventListener("click", e=>{
      if(!sidePanel.contains(e.target) && e.target!==orbitBtn) sidePanel.classList.remove("active");
      if(!leftPanel.contains(e.target) && e.target!==anomalousBtn) leftPanel.classList.remove("active");
    });
  </script>
</body>
</html>
