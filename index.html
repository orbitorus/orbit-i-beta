<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Satellite Constellations Overview</title>
  <style>
    body { 
      margin: 0; 
      background: black; 
      font-family: 'Segoe UI', Roboto, sans-serif; 
      color: white; 
      overflow-x: hidden;
    }

    /* Top banner */
    #top-banner {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 50px;
      background: rgba(40, 40, 40, 0.95);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 20px;
      z-index: 20;
      font-size: 20px;
      font-weight: bold;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
    }
    #top-banner span { flex-shrink: 0; }
    #top-banner button, #top-banner a {
      background-color: #1e90ff;
      border: none;
      color: white;
      padding: 6px 14px;
      font-size: 14px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
      text-decoration: none;
    }
    #top-banner button:hover:not(:disabled), #top-banner a:hover { background-color: #63b3ff; }
    #top-banner button:disabled { opacity: 0.4; cursor: default; }
    #top-banner select {
      background-color: #222;
      color: white;
      border: 1px solid #555;
      padding: 5px 10px;
      font-size: 14px;
      border-radius: 4px;
      cursor: pointer;
      transition: box-shadow 0.5s ease, border 0.3s ease;
    }

    /* 🌟 Glowing yellow highlight around the select */
    .highlight-select {
      animation: glowPulse 1.5s infinite alternate;
      box-shadow: 0 0 10px 2px rgba(255, 255, 0, 0.8);
      border-color: yellow;
    }

    @keyframes glowPulse {
      0% { box-shadow: 0 0 10px 2px rgba(255,255,0,0.7); }
      100% { box-shadow: 0 0 20px 4px rgba(255,255,100,1); }
    }

    #top-links { margin-left: 10%; display: flex; gap: 10px; }

    #info-banner {
      position: fixed;
      top: 50px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 900px;
      background: linear-gradient(90deg, rgba(50,50,50,0.9), rgba(20,20,20,0.9));
      color: #e0e0e0;
      text-align: center;
      padding: 14px 20px;
      font-size: 15px;
      border-radius: 8px;
      margin-top: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      opacity: 0;
      z-index: 30;
      transition: opacity 0.8s ease, transform 0.8s ease;
      backdrop-filter: blur(4px);
    }
    #info-banner.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #info-banner.hide { opacity: 0; transform: translateX(-50%) translateY(-10px); }

    /* rest of your CSS unchanged... */
  </style>
</head>
<body>
  <div id="top-banner">
    <span>Major LEO Constellation Visualization</span>
    <select id="constellation-select">
      <option value="all">🌐 All Active Satellites</option>
      <option value="oneweb">🇬🇧 OneWeb</option>
      <option value="kuiper">🇺🇸 Kuiper</option>
      <option value="starlink">🇺🇸 Starlink</option>
      <option value="iridium-NEXT">🇺🇸 Iridium-NEXT</option>
      <option value="hulianwang">🇨🇳 Hulianwang</option>
      <option value="qianfan">🇨🇳 Qianfan</option>
      <option value="planet">🇺🇸 Planet</option>
    </select>
    <button id="orbit-btn" disabled>Orbit Analysis</button>
    <div id="top-links">
      <a href="https://orbitorus.grafana.net/public-dashboards/b8a8e84a4de84bb2b02b57b866dd158d" target="_blank" rel="noopener noreferrer">Track and Monitor</a>
      <a href="https://orbitorus.grafana.net/public-dashboards/a983503e27b34b19a1efc0f8f5f4dd9c" target="_blank" rel="noopener noreferrer">Summary Dashboard</a>
    </div>
  </div>

  <div id="info-banner">
    This website helps you find apparent anomalous satellites from major mega constellations.<br>
    Select a constellation from the drop-down list.
  </div>

  <!-- rest of body ... -->

  <script>
    const infoBanner = document.getElementById('info-banner');
    const selectEl = document.getElementById('constellation-select');

    window.addEventListener("load", () => {
      // show banner
      infoBanner.classList.add("show");
      // add glow to the dropdown
      selectEl.classList.add("highlight-select");

      // hide banner and remove glow after 10s
      setTimeout(() => {
        infoBanner.classList.add("hide");
        // remove glow smoothly
        selectEl.classList.remove("highlight-select");
        setTimeout(() => infoBanner.style.display = "none", 800);
      }, 10000);
    });
  </script>
</body>
</html>
