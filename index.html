<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Satellite Constellations Overview</title>
  <style>
    body {
      margin: 0;
      background: black;
      font-family: sans-serif;
      color: white;
      overflow: hidden;
    }

    /* Top banner */
    #top-banner {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 50px;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      box-sizing: border-box;
      z-index: 10;
    }

    /* Dropdown & Button styling */
    #constellation-select,
    #orbit-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: white;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      backdrop-filter: blur(5px);
      transition: background 0.3s;
    }

    #constellation-select:hover,
    #orbit-btn:hover:enabled {
      background: rgba(255, 255, 255, 0.25);
    }

    #orbit-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Globe container */
    #chart {
      position: absolute;
      top: 50px;
      left: 0;
      width: 100%;
      height: calc(100% - 50px);
      transition: width 0.6s ease;
    }

    /* Slide-out side panel */
    #side-panel {
      position: fixed;
      top: 50px;
      right: -50%;
      width: 50%;
      height: calc(100% - 50px);
      background: #111;
      border-left: 2px solid #333;
      transition: right 0.6s ease;
      z-index: 15;
    }

    #side-panel iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Active panel states */
    body.panel-open #chart {
      width: 50%;
    }

    body.panel-open #side-panel {
      right: 0;
    }
  </style>
</head>
<body>
  <div id="top-banner">
    <select id="constellation-select">
      <option value="all">All Active Satellites</option>
      <option value="starlink">Starlink</option>
      <option value="oneweb">OneWeb</option>
      <option value="gps">GPS</option>
    </select>
    <button id="orbit-btn" disabled>Orbit Analysis</button>
  </div>

  <div id="chart">
    <!-- Your 3D globe or particle system -->
    <canvas id="globe"></canvas>
  </div>

  <!-- Slide-out side panel -->
  <div id="side-panel">
    <iframe id="side-iframe" src=""></iframe>
  </div>

  <script>
    const constellationSelect = document.getElementById("constellation-select");
    const orbitBtn = document.getElementById("orbit-btn");
    const sidePanel = document.getElementById("side-panel");
    const sideIframe = document.getElementById("side-iframe");

    let activeConstellation = "all";

    // Enable Orbit Analysis button only if a specific constellation is selected
    constellationSelect.addEventListener("change", (e) => {
      activeConstellation = e.target.value;
      orbitBtn.disabled = activeConstellation === "all";
    });

    // When "Orbit Analysis" is clicked
    orbitBtn.addEventListener("click", () => {
      if (!activeConstellation || activeConstellation === "all") return;

      // Load constellation-specific index3.html inside iframe
      sideIframe.src = `${activeConstellation}/index3.html`;

      // Open the panel
      document.body.classList.add("panel-open");
    });

    // Click outside the side panel closes it
    document.addEventListener("click", (e) => {
      const isClickInsidePanel = sidePanel.contains(e.target);
      const isButton = e.target.id === "orbit-btn";
      const isSelect = e.target.id === "constellation-select";
      if (!isClickInsidePanel && !isButton && !isSelect) {
        document.body.classList.remove("panel-open");
      }
    });

    // Example: Initialize your 3D globe here (Three.js, etc.)
    // const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('globe') });
    // renderer.setSize(window.innerWidth, window.innerHeight);
    // animate();
  </script>
</body>
</html>
