<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Satellite Constellations Overview</title>
  <style>
    body { 
      margin: 0; 
      background: black; 
      font-family: 'Segoe UI', Roboto, sans-serif; 
      color: white; 
      overflow-x: hidden;
    }
    /* Top banner */
    #top-banner {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 50px;
      background: rgba(40, 40, 40, 0.95);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 20px;
      z-index: 20;
      font-size: 20px;
      font-weight: bold;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
    }
    #top-banner span { flex-shrink: 0; }
    #top-banner button, #top-banner a {
      background-color: #1e90ff;
      border: none;
      color: white;
      padding: 6px 14px;
      font-size: 14px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
      text-decoration: none;
    }
    #top-banner button:hover:not(:disabled), #top-banner a:hover { background-color: #63b3ff; }
    #top-banner button:disabled { opacity: 0.4; cursor: default; }
    #top-banner select {
      background-color: #222;
      color: white;
      border: 1px solid #555;
      padding: 5px 10px;
      font-size: 14px;
      border-radius: 4px;
      cursor: pointer;
    }
    #top-links { margin-left: 10%; display: flex; gap: 10px; }

    #info-banner {
      position: fixed;
      top: 50px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 900px;
      background: linear-gradient(90deg, rgba(50,50,50,0.9), rgba(20,20,20,0.9));
      color: #e0e0e0;
      text-align: center;
      padding: 14px 20px;
      font-size: 15px;
      border-radius: 8px;
      margin-top: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      opacity: 0;
      z-index: 30;
      transition: opacity 0.8s ease, transform 0.8s ease;
      backdrop-filter: blur(4px);
    }
    #info-banner.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #info-banner.hide { opacity: 0; transform: translateX(-50%) translateY(-10px); }

    /* Loading overlay */
    #loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(40,40,40,0.9);
      padding: 15px 25px;
      border-radius: 8px;
      font-size: 15px;
      text-align: center;
      display: none;
      z-index: 1000;
      width: 250px;
      box-shadow: 0 0 12px rgba(0,0,0,0.5);
    }
    #loading-bar {
      width: 100%;
      height: 8px;
      background: rgba(255,255,255,0.1);
      border-radius: 4px;
      overflow: hidden;
      margin-top: 10px;
    }
    #loading-progress {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #1e90ff, #63b3ff);
      transition: width 0.3s ease;
    }

    #time-log {
      position: absolute;
      font-size: 12px;
      padding: 5px;
      border-radius: 3px;
      background-color: rgba(200, 200, 200, 0.1);
      color: lavender;
      bottom: 10px;
      right: 10px;
    }

    #chart { 
      width: 100%; 
      height: 100vh; 
      margin-top: 50px; 
      transition: all 0.5s ease; 
      position: absolute;
      top: 50px;
      left: 0;
    }

    #side-panel {
      position: fixed;
      top: 50px;
      right: 0;
      width: 50%;
      height: calc(100% - 50px);
      background: rgba(20, 20, 20, 0.95);
      transform: translateX(100%);
      transition: transform 0.5s ease;
      padding: 20px;
      box-shadow: -4px 0 12px rgba(0, 0, 0, 0.5);
      z-index: 2000;
      overflow: auto;
    }
    #side-panel.active { transform: translateX(0); }
    #side-panel iframe { width: 100%; height: 100%; border: none; }

    /* 🌍 Temporary glow effect on Earth */
    @keyframes earthGlow {
      0%, 100% { filter: drop-shadow(0 0 20px rgba(0,150,255,0.3)); }
      50% { filter: drop-shadow(0 0 50px rgba(0,200,255,0.6)); }
    }
    .earth-glow canvas {
      animation: earthGlow 3s ease-in-out infinite;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/globe.gl"></script>
</head>
<body>
  <div id="top-banner">
    <span>Major LEO Constellation Visualization</span>
    <select id="constellation-select">
      <option value="all">🌐 All Active Satellites</option>
      <option value="oneweb">🇬🇧 OneWeb</option>
      <option value="kuiper">🇺🇸 Kuiper</option>
      <option value="starlink">🇺🇸 Starlink</option>
      <option value="iridium-NEXT">🇺🇸 Iridium-NEXT</option>
      <option value="hulianwang">🇨🇳 Hulianwang</option>
      <option value="qianfan">🇨🇳 Qianfan</option>
      <option value="planet">🇺🇸 Planet</option>
    </select>
    <button id="orbit-btn" disabled>Orbit Analysis</button>
    <div id="top-links">
      <a href="https://orbitorus.grafana.net/public-dashboards/b8a8e84a4de84bb2b02b57b866dd158d" target="_blank" rel="noopener noreferrer">Track and Monitor</a>
      <a href="https://orbitorus.grafana.net/public-dashboards/a983503e27b34b19a1efc0f8f5f4dd9c" target="_blank" rel="noopener noreferrer">Summary Dashboard</a>
    </div>
  </div>

  <div id="info-banner">
    This website helps you find apparent anomalous satellites from major mega constellations.<br>
    Select a constellation from the drop-down list.
  </div>

  <div id="loading" aria-hidden="true">
    <div id="loading-text">Loading satellites... <span id="loading-percent">0%</span></div>
    <div id="loading-bar"><div id="loading-progress"></div></div>
  </div>

  <div id="chart"></div>
  <div id="time-log"></div>

  <div id="side-panel">
    <iframe id="orbitLink" src=""></iframe>
  </div>

  <script type="module">
    import * as satellite from 'https://esm.sh/satellite.js';
    const infoBanner = document.getElementById('info-banner');
    const chart = document.getElementById("chart");

    // === Initialize Globe ===
    const world = Globe()(chart)
      .globeImageUrl('//cdn.jsdelivr.net/npm/three-globe/example/img/earth-night.jpg')
      .backgroundColor('#000')
      .showAtmosphere(true)
      .atmosphereColor('rgba(70,120,180,0.3)')
      .particleLat('lat')
      .particleLng('lng')
      .particleAltitude('alt')
      .particlesColor(() => 'rgba(255,255,200,1)');

    setTimeout(() => world.pointOfView({ altitude: 3.5 }));

    // 🌍 Add temporary glow for the duration of info banner
    window.addEventListener("load", () => {
      infoBanner.classList.add("show");
      chart.classList.add("earth-glow"); // add glow effect
      setTimeout(() => {
        infoBanner.classList.add("hide");
        chart.classList.remove("earth-glow"); // remove glow when banner fades
        setTimeout(() => infoBanner.style.display = "none", 800);
      }, 10000);
    });

    // (Rest of your code unchanged)
  </script>
</body>
</html>
