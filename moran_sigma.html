<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spatial Statistics: Moran's I vs Sigma-based Analysis</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>

<style>
/* ===================== BASE ===================== */
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: system-ui, sans-serif;
    background: linear-gradient(135deg, #0a1929, #1e3a5f, #0d2847);
    padding: 20px;
    color: #e0e7ff;
}

.container { max-width: 1400px; margin: auto; }

h1 { color: #fbbf24; margin-bottom: .5rem; }
.subtitle { color: #93c5fd; margin-bottom: 1.5rem; }

/* ===================== CARDS ===================== */
.card {
    background: rgba(30, 58, 95, 0.6);
    border-radius: 8px;
    padding: 1.5rem;
    border: 2px solid rgba(251, 191, 36, 0.3);
    margin-bottom: 1.5rem;
}

.card h3 { color: #fbbf24; }

/* ===================== BUTTONS ===================== */
.btn {
    padding: .75rem 1rem;
    border: 2px solid rgba(251, 191, 36, .5);
    border-radius: 8px;
    background: rgba(10, 25, 41, .8);
    color: #e0e7ff;
    cursor: pointer;
    transition: .25s;
}

.btn:hover { border-color: #fbbf24; }

.btn-primary {
    background: linear-gradient(135deg, #fbbf24, #f59e0b);
    color: #0a1929;
    font-weight: 600;
}

/* ===================== GRIDS ===================== */
.stats-grid, .grid-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
    gap: 1.5rem;
}

/* ===================== LEGEND ===================== */
.legend {
    font-size: .875rem;
    color: #93c5fd;
    margin-top: 1rem;
}

/* ===================== SIGMA BUTTONS ===================== */
.sigma-btn {
    padding: .5rem 1.5rem;
    border: 2px solid rgba(251,191,36,.5);
    border-radius: 6px;
    background: rgba(10,25,41,.8);
    color: #e0e7ff;
    cursor: pointer;
}

.sigma-btn.active {
    background: linear-gradient(135deg, #fbbf24, #f59e0b);
    color: #0a1929;
    font-weight: 600;
}
</style>
</head>

<body>
<div class="container">

<h1>Spatial Statistics: Moran's I vs Sigma-based Analysis</h1>
<p class="subtitle">Spatial autocorrelation vs classical outlier detection</p>

<!-- ===================== PATTERN SELECTOR ===================== -->
<div class="card">
<label>Select Spatial Pattern:</label>

<div class="pattern-buttons"
     style="display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;margin-top:.75rem">
    <button class="btn btn-primary" onclick="changePattern('clustered')">Clustered</button>
    <button class="btn" onclick="changePattern('dispersed')">Dispersed</button>
    <button class="btn" onclick="changePattern('random')">Random</button>
    <button class="btn" onclick="changePattern('gradient')">Gradient</button>
</div>

<div style="margin-top:1rem">
    <button class="sigma-btn active" onclick="changeSigma(1)">±1σ</button>
    <button class="sigma-btn" onclick="changeSigma(2)">±2σ</button>
    <button class="sigma-btn" onclick="changeSigma(3)">±3σ</button>
</div>
</div>

<!-- ===================== CHARTS ===================== -->
<div class="grid-container">

<div class="card">
<h3>Moran Scatterplot (Spatial Context)</h3>

<div style="min-height:360px">
    <canvas id="moranScatterChart"></canvas>
</div>

<div class="legend" style="background:rgba(10,25,41,.6);padding:.75rem;border-radius:6px">
<strong>X:</strong> Standardized value |
<strong>Y:</strong> Spatial lag
<div style="display:flex;gap:1rem;margin-top:.5rem;flex-wrap:wrap">
<div style="color:#22c55e">● High–High</div>
<div style="color:#ef4444">● Low–Low</div>
<div style="color:#f59e0b">● High–Low</div>
<div style="color:#3b82f6">● Low–High</div>
</div>
</div>
</div>

<div class="card">
<h3>Value Distribution (Sigma Context)</h3>
<canvas id="histogramChart"></canvas>
</div>

</div>

</div>

<script>
let currentPattern = 'clustered';
let currentSigma = 1;
let moranScatterChart, histogramChart;

/* ===================== BUTTON LOGIC ===================== */
function changePattern(pattern) {
    currentPattern = pattern;

    document.querySelectorAll('.pattern-buttons .btn')
        .forEach(b => b.classList.remove('btn-primary'));

    const patterns = ['clustered','dispersed','random','gradient'];
    document.querySelectorAll('.pattern-buttons .btn')
        [patterns.indexOf(pattern)]
        .classList.add('btn-primary');

    updateCharts();
}

function changeSigma(s) {
    currentSigma = s;
    document.querySelectorAll('.sigma-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    updateCharts();
}

/* ===================== DATA ===================== */
function generateData() {
    const data = [];
    for (let i=0;i<30;i++)
        for (let j=0;j<30;j++)
            data.push({x:i,y:j,value:Math.random()*100});
    return data;
}

/* ===================== CHARTS ===================== */
function updateCharts() {
    const data = generateData();
    drawMoran(data);
}

function drawMoran(data) {
    const ctx = document.getElementById('moranScatterChart').getContext('2d');
    if (moranScatterChart) moranScatterChart.destroy();

    moranScatterChart = new Chart(ctx,{
        type:'scatter',
        data:{
            datasets:[{
                data:data.map(d=>({x:d.value/50-1,y:d.value/50-1})),
                backgroundColor:'#22c55e',
                pointRadius:3
            }]
        },
        options:{
            responsive:true,
            plugins:{
                legend:{ display:false }   // IMPORTANT FIX
            },
            scales:{
                x:{ title:{display:true,text:'Standardized Value'}},
                y:{ title:{display:true,text:'Spatial Lag'}}
            }
        }
    });
}

updateCharts();
</script>

</body>
</html>
