<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Satellite Constellations Overview</title>
  <style>
    body { margin: 0; background: black; font-family: sans-serif; color: white; }

    /* Top banner */
    #top-banner {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 50px;
      background: rgba(40, 40, 40, 0.95);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 20px;
      z-index: 20;
      font-size: 20px;
      font-weight: bold;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
    }

    #top-banner select {
      background-color: #222;
      color: white;
      border: 1px solid #555;
      padding: 5px 10px;
      font-size: 14px;
      border-radius: 4px;
      cursor: pointer;
      transition: box-shadow 0.3s ease;
    }

    /* Glow effect */
    .glow {
      animation: glowEffect 1s infinite alternate;
    }

    @keyframes glowEffect {
      from { box-shadow: 0 0 5px #1e90ff, 0 0 10px #1e90ff; }
      to { box-shadow: 0 0 20px #1e90ff, 0 0 40px #63b3ff; }
    }

    /* Tutorial banner */
    #tutorial-banner {
      position: fixed;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      width: 70%;
      background: rgba(30, 30, 30, 0.95);
      color: #f0f0f0;
      padding: 16px 20px;
      border-radius: 10px;
      text-align: center;
      font-size: 16px;
      line-height: 1.5;
      box-shadow: 0 0 10px rgba(0,0,0,0.6);
      z-index: 25;
      animation: fadeIn 0.5s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translate(-50%, -20px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }

    @keyframes fadeOut {
      from { opacity: 1; transform: translate(-50%, 0); }
      to { opacity: 0; transform: translate(-50%, -20px); }
    }

    .highlight-yellow {
      color: yellow;
      font-weight: bold;
    }

    /* Arrow pointing to dropdown */
    #arrow-pointer {
      position: fixed;
      top: 55px;
      left: 230px; /* adjust based on dropdown position */
      font-size: 28px;
      color: yellow;
      animation: bounce 1s infinite alternate;
      z-index: 30;
      text-shadow: 0 0 8px yellow;
    }

    @keyframes bounce {
      from { transform: translateY(0); opacity: 1; }
      to { transform: translateY(10px); opacity: 0.8; }
    }

    #loading {
      position: fixed;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.1);
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 14px;
      display: none;
      z-index: 15;
    }

    #time-log {
      position: absolute;
      font-size: 12px;
      padding: 5px;
      border-radius: 3px;
      background-color: rgba(200, 200, 200, 0.1);
      color: lavender;
      bottom: 10px;
      right: 10px;
    }

    #chart { width: 100%; height: 100vh; margin-top: 50px; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/globe.gl"></script>
</head>
<body>
  <!-- Top Banner -->
  <div id="top-banner">
    <span>Major LEO Constellation Visualization</span>

    <select id="constellation-select">
      <option value="all">🌐 All Active Satellites</option>
      <option value="oneweb">🇬🇧 OneWeb</option>
      <option value="kuiper">🇺🇸 Kuiper</option>
      <option value="starlink">🇺🇸 Starlink</option>
      <option value="iridium-NEXT">🇺🇸 Iridium-NEXT</option>
      <option value="hulianwang">🇨🇳 Hulianwang</option>
      <option value="qianfan">🇨🇳 Qianfan</option>
      <option value="planet">🇺🇸 Planet</option>
    </select>

    <button id="orbit-btn" disabled>Orbit Analysis</button>

    <div style="margin-left:auto; display:flex; gap:10px;">
      <a href="#" class="btn">Track and Monitor</a>
      <a href="#" class="btn">Summary Dashboard</a>
    </div>
  </div>

  <div id="loading">Loading satellites...</div>
  <div id="chart"></div>
  <div id="time-log"></div>

  <!-- Tutorial Banner -->
  <div id="tutorial-banner">
    Welcome! This website helps you find <span class="highlight-yellow">apparent anomalous satellites</span> from major mega constellations.<br>
    Please select your interested constellation from the dropdown list above to begin exploring.
  </div>

  <!-- Animated Arrow -->
  <div id="arrow-pointer">⬇️</div>

  <script>
    const selectEl = document.getElementById("constellation-select");
    const tutorialBanner = document.getElementById("tutorial-banner");
    const arrowPointer = document.getElementById("arrow-pointer");

    // Highlight dropdown with glow
    selectEl.classList.add("glow");

    // Hide banner, arrow, and glow after 10 seconds
    setTimeout(() => {
      tutorialBanner.style.animation = "fadeOut 1s forwards";
      selectEl.classList.remove("glow");
      arrowPointer.style.animation = "fadeOut 1s forwards";
      setTimeout(() => {
        tutorialBanner.remove();
        arrowPointer.remove();
      }, 1000);
    }, 10000);
  </script>
</body>
</html>
