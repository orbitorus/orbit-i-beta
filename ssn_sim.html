<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space-Based Optical Surveillance System</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
    }
    #root {
      width: 100%;
      height: 100vh;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    
    // Icon components
    const Play = ({ size = 24 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <polygon points="5 3 19 12 5 21 5 3"></polygon>
      </svg>
    );
    
    const Pause = ({ size = 24 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <rect x="6" y="4" width="4" height="16"></rect>
        <rect x="14" y="4" width="4" height="16"></rect>
      </svg>
    );
    
    const RotateCcw = ({ size = 24 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <polyline points="1 4 1 10 7 10"></polyline>
        <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
      </svg>
    );
    
    const Info = ({ size = 24, color = "currentColor" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="16" x2="12" y2="12"></line>
        <line x1="12" y1="8" x2="12.01" y2="8"></line>
      </svg>
    );
    

const SpaceSurveillanceSimulation = () => {
  const canvasRef = useRef(null);
  const containerRef = useRef(null);
  const [isRunning, setIsRunning] = useState(true);
  const [time, setTime] = useState(0);
  const [selectedObject, setSelectedObject] = useState(null);
  const [speed, setSpeed] = useState(0.3);
  const [canvasSize, setCanvasSize] = useState(700);
  const [showTracksatFOV, setShowTracksatFOV] = useState(true);
  const [showSatOFOV, setShowSatOFOV] = useState(true);
  const [selectedPlotObject, setSelectedPlotObject] = useState('Tracksat-2'); // Object to plot
  const [isPlotting, setIsPlotting] = useState(true); // Toggle for plot recording
  const [rangeHistory, setRangeHistory] = useState({}); // Store range history for plotting
  const [detectionData, setDetectionData] = useState({
    starTracker: [],
    irCamera: [],
    rangeEstimates: []
  });
  const [showInfo, setShowInfo] = useState(true);

  // Handle canvas resize - only on window resize, not initial load
  useEffect(() => {
    const updateCanvasSize = () => {
      if (containerRef.current) {
        const containerWidth = containerRef.current.clientWidth;
        // Make canvas 70% of container width, square, max 900px
        const size = Math.min(containerWidth * 0.7, 900);
        setCanvasSize(Math.round(size));
      }
    };

    // Only update on window resize, not on initial mount
    window.addEventListener('resize', updateCanvasSize);
    return () => window.removeEventListener('resize', updateCanvasSize);
  }, []);

  // Simulation parameters
  const config = {
    earthRadius: 60,
    orbitRadius: 110,
    outerOrbitRadius: 160,
    numSatellites: 3,
    numDebris: 15,
    numOuterSatellites: 8,
    numOuterDebris: 12,
    cameraFOV: Math.PI / 6, // 30 degrees
    beaconRange: 450,
    speedScale: speed
  };

  // Initialize satellites with beacons
  const initSatellites = () => {
    const satellites = [];
    
    // Inner orbit satellites (clockwise)
    for (let i = 0; i < config.numSatellites; i++) {
      const angle = (i / config.numSatellites) * 2 * Math.PI;
      satellites.push({
        id: `Tracksat-${i + 1}`,
        type: 'satellite',
        angle: angle,
        orbitRadius: config.orbitRadius,
        angularVelocity: 0.02,
        hasBeacon: true,
        beaconActive: true,
        beaconPhase: Math.random() * Math.PI * 2,
        beaconFreq: 10, // Hz
        health: 100,
        orbitType: 'inner'
      });
    }
    
    // Outer orbit satellites (counter-clockwise)
    for (let i = 0; i < config.numOuterSatellites; i++) {
      const angle = (i / config.numOuterSatellites) * 2 * Math.PI;
      satellites.push({
        id: `SAT-O${i + 1}`,
        type: 'satellite',
        angle: angle,
        orbitRadius: config.outerOrbitRadius,
        angularVelocity: -0.015, // Negative for counter-clockwise
        hasBeacon: true,
        beaconActive: true,
        beaconPhase: Math.random() * Math.PI * 2,
        beaconFreq: 10, // Hz
        health: 100,
        orbitType: 'outer'
      });
    }
    
    return satellites;
  };

  // Initialize debris (non-cooperative)
  const initDebris = () => {
    const debris = [];
    
    // Inner orbit debris (clockwise)
    for (let i = 0; i < config.numDebris; i++) {
      const angle = Math.random() * 2 * Math.PI;
      const radius = config.orbitRadius + (Math.random() - 0.5) * 80;
      debris.push({
        id: `DEB-${i + 1}`,
        type: 'debris',
        angle: angle,
        orbitRadius: radius,
        angularVelocity: 0.015 + Math.random() * 0.01,
        hasBeacon: false,
        tumbleRate: Math.random() * 5,
        brightness: 0.3 + Math.random() * 0.7,
        orbitType: 'inner'
      });
    }
    
    // Outer orbit debris (counter-clockwise)
    for (let i = 0; i < config.numOuterDebris; i++) {
      const angle = Math.random() * 2 * Math.PI;
      const radius = config.outerOrbitRadius + (Math.random() - 0.5) * 80;
      debris.push({
        id: `DEB-O${i + 1}`,
        type: 'debris',
        angle: angle,
        orbitRadius: radius,
        angularVelocity: -(0.012 + Math.random() * 0.008), // Negative for counter-clockwise
        hasBeacon: false,
        tumbleRate: Math.random() * 5,
        brightness: 0.3 + Math.random() * 0.7,
        orbitType: 'outer'
      });
    }
    
    return debris;
  };

  const [satellites] = useState(initSatellites());
  const [debris] = useState(initDebris());
  const [observerSats, setObserverSats] = useState(() => {
    // All satellites are observers (indices 0-10: 3 inner + 8 outer)
    return Array.from({length: 11}, (_, i) => i);
  });

  // Calculate position from orbital parameters
  const getPosition = (obj, currentTime) => {
    const angle = obj.angle + obj.angularVelocity * currentTime;
    return {
      x: Math.cos(angle) * obj.orbitRadius,
      y: Math.sin(angle) * obj.orbitRadius,
      angle: angle
    };
  };

  // Check if object is in camera FOV
  const isInFOV = (observerPos, targetPos, observerAngle, fov) => {
    const dx = targetPos.x - observerPos.x;
    const dy = targetPos.y - observerPos.y;
    const distance = Math.sqrt(dx * dx + dy * dy);
    
    if (distance < 10) return false; // Too close
    
    const angleToTarget = Math.atan2(dy, dx);
    let relativeAngle = angleToTarget - observerAngle;
    
    // Normalize angle to [-PI, PI]
    while (relativeAngle > Math.PI) relativeAngle -= 2 * Math.PI;
    while (relativeAngle < -Math.PI) relativeAngle += 2 * Math.PI;
    
    return Math.abs(relativeAngle) < fov / 2;
  };

  // Check if line of sight between two positions is blocked by Earth
  const isBlockedByEarth = (pos1, pos2, earthRadius) => {
    // Vector from pos1 to pos2
    const dx = pos2.x - pos1.x;
    const dy = pos2.y - pos1.y;
    const lineLength = Math.sqrt(dx * dx + dy * dy);
    
    if (lineLength === 0) return true;
    
    // Unit vector along the line
    const ux = dx / lineLength;
    const uy = dy / lineLength;
    
    // Find closest point on line segment to Earth center (0, 0)
    // Using parametric form: point = pos1 + t * unitVector
    const t = -(pos1.x * ux + pos1.y * uy);
    
    // Clamp t to line segment bounds
    const tClamped = Math.max(0, Math.min(lineLength, t));
    
    // Closest point on line segment to Earth center
    const closestX = pos1.x + tClamped * ux;
    const closestY = pos1.y + tClamped * uy;
    
    // Distance from Earth center to closest point
    const distToEarth = Math.sqrt(closestX * closestX + closestY * closestY);
    
    // Blocked if line passes through Earth
    return distToEarth < earthRadius;
  };

  // Calculate range using different methods
  const calculateRange = (observerPos, targetPos, method, obj, currentTime) => {
    const dx = targetPos.x - observerPos.x;
    const dy = targetPos.y - observerPos.y;
    const actualDistance = Math.sqrt(dx * dx + dy * dy);
    
    if (method === 'photometric' && obj.hasBeacon) {
      // Brightness-based ranging for beaconed satellites
      const beaconPower = 5; // watts
      const measuredIntensity = beaconPower / (actualDistance * actualDistance);
      const estimatedRange = Math.sqrt(beaconPower / measuredIntensity);
      const error = (Math.random() - 0.5) * 0.2; // 20% error
      return estimatedRange * (1 + error);
    } else if (method === 'geometric') {
      // Triangulation-based (simulated)
      const error = (Math.random() - 0.5) * 0.05; // 5% error
      return actualDistance * (1 + error);
    } else if (method === 'angular_rate') {
      // Angular rate method
      const angularRate = Math.abs(obj.angularVelocity);
      const error = (Math.random() - 0.5) * 0.15; // 15% error
      return actualDistance * (1 + error);
    }
    return actualDistance;
  };

  // Main simulation update
  useEffect(() => {
    if (!isRunning) return;
    
    const interval = setInterval(() => {
      setTime(t => t + speed);
    }, 50);
    
    return () => clearInterval(interval);
  }, [isRunning, speed]);

  // Detection and ranging update
  useEffect(() => {
    const allDetectionData = {};
    
    observerSats.forEach(obsIdx => {
      const observer = satellites[obsIdx];
      const observerPos = getPosition(observer, time);
      
      // Outer orbit satellites point inward, inner orbit satellites point along tangent
      const isOuterOrbit = observer.orbitType === 'outer';
      const fovAngle = isOuterOrbit ? observerPos.angle + Math.PI : observerPos.angle;
      
      // Check if this observer's FOV is enabled (determines if sun glint should be detected)
      const isFOVEnabled = isOuterOrbit ? showSatOFOV : showTracksatFOV;
      
      const starTrackerDetections = [];
      const irCameraDetections = [];
      const rangeEstimates = [];
      
      // Check all objects
      [...satellites, ...debris].forEach(obj => {
        if (obj === observer) return;
        
        const targetPos = getPosition(obj, time);
        const inFOV = isInFOV(observerPos, targetPos, fovAngle, config.cameraFOV);
        
        // Check if line of sight is blocked by Earth
        const blocked = isBlockedByEarth(observerPos, targetPos, config.earthRadius);
        
        if (inFOV && !blocked) {
          const distance = Math.sqrt(
            Math.pow(targetPos.x - observerPos.x, 2) + 
            Math.pow(targetPos.y - observerPos.y, 2)
          );
          
          // Star tracker detection (visible wavelengths)
          if (distance < config.beaconRange) {
            starTrackerDetections.push({
              id: obj.id,
              type: obj.type,
              distance: distance,
              angularPosition: Math.atan2(
                targetPos.y - observerPos.y,
                targetPos.x - observerPos.x
              )
            });
          }
          
          // IR camera detection (800-1600nm) - only if FOV is enabled
          if (obj.hasBeacon && obj.beaconActive && isFOVEnabled) {
            const beaconVisible = Math.sin(time * obj.beaconFreq + obj.beaconPhase) > 0;
            if (beaconVisible && distance < config.beaconRange) {
              irCameraDetections.push({
                id: obj.id,
                type: obj.type,
                distance: distance,
                beaconStrength: 1.0 - (distance / config.beaconRange),
                modulation: obj.beaconFreq
              });
              
              // Range estimates
              const photoRange = calculateRange(observerPos, targetPos, 'photometric', obj, time);
              const geoRange = calculateRange(observerPos, targetPos, 'geometric', obj, time);
              
              rangeEstimates.push({
                id: obj.id,
                actual: distance,
                photometric: photoRange,
                geometric: geoRange,
                combined: (photoRange + geoRange * 2) / 3 // Weighted average
              });
            }
          } else if (!obj.hasBeacon && isFOVEnabled) {
            // Non-cooperative object (debris) - sun glint detection
            // Only detect if this observer's FOV is enabled
            const glintVisible = Math.sin(time * obj.tumbleRate) > 0.7;
            if (glintVisible && distance < config.beaconRange * 0.7) {
              irCameraDetections.push({
                id: obj.id,
                type: obj.type,
                distance: distance,
                beaconStrength: 0.3 * obj.brightness,
                modulation: 0
              });
              
              const angularRange = calculateRange(observerPos, targetPos, 'angular_rate', obj, time);
              rangeEstimates.push({
                id: obj.id,
                actual: distance,
                photometric: null,
                geometric: angularRange,
                combined: angularRange
              });
            }
          }
        }
      });
      
      allDetectionData[obsIdx] = {
        starTracker: starTrackerDetections,
        irCamera: irCameraDetections,
        rangeEstimates: rangeEstimates
      };
    });
    
    setDetectionData(allDetectionData);
    
    // Collect range history for plotting (keep last 100 data points) - only if plotting is enabled
    if (isPlotting) {
      setRangeHistory(prev => {
        const newHistory = { ...prev };
        const maxPoints = 100;
        
        // For each observer, record ranges to selected object
        observerSats.forEach(obsIdx => {
          const observer = satellites[obsIdx];
          const data = allDetectionData[obsIdx];
          
          // Find selected object in range estimates
          const estimate = data.rangeEstimates.find(est => est.id === selectedPlotObject);
          
          if (estimate) {
            const key = `${observer.id}-${selectedPlotObject}`;
            if (!newHistory[key]) {
              newHistory[key] = [];
            }
            
            newHistory[key].push({
              time: time,
              actual: estimate.actual,
              geometric: estimate.geometric,
              photometric: estimate.photometric
            });
            
            // Keep only last maxPoints
            if (newHistory[key].length > maxPoints) {
              newHistory[key] = newHistory[key].slice(-maxPoints);
            }
          }
        });
        
        return newHistory;
      });
    }
  }, [time, observerSats, showTracksatFOV, showSatOFOV, selectedPlotObject, isPlotting]);

  // Drawing
  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    
    const ctx = canvas.getContext('2d');
    const width = canvas.width;
    const height = canvas.height;
    const centerX = width / 2;
    const centerY = height / 2;
    
    // Clear
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, width, height);
    
    // Draw stars background
    ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
    for (let i = 0; i < 100; i++) {
      const x = (i * 127) % width;
      const y = (i * 257) % height;
      ctx.fillRect(x, y, 1, 1);
    }
    
    // Draw Earth
    const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, config.earthRadius);
    gradient.addColorStop(0, '#1e40af');
    gradient.addColorStop(0.7, '#1e3a8a');
    gradient.addColorStop(1, '#1e293b');
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(centerX, centerY, config.earthRadius, 0, Math.PI * 2);
    ctx.fill();
    
    // Draw orbit paths with direction indicators
    ctx.strokeStyle = 'rgba(100, 116, 139, 0.3)';
    ctx.lineWidth = 1;
    
    // Inner orbit (clockwise)
    ctx.beginPath();
    ctx.arc(centerX, centerY, config.orbitRadius, 0, Math.PI * 2);
    ctx.stroke();
    
    // Outer orbit (counter-clockwise)
    ctx.beginPath();
    ctx.arc(centerX, centerY, config.outerOrbitRadius, 0, Math.PI * 2);
    ctx.stroke();
    
    // Draw direction arrows
    const drawArrow = (x, y, angle, color, reverse = false) => {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle + (reverse ? Math.PI : 0));
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(-8, -5);
      ctx.lineTo(-8, 5);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    };
    
    // Inner orbit arrows (clockwise - 4 arrows)
    for (let i = 0; i < 4; i++) {
      const angle = (i / 4) * 2 * Math.PI + Math.PI / 8;
      const x = centerX + Math.cos(angle) * config.orbitRadius;
      const y = centerY + Math.sin(angle) * config.orbitRadius;
      drawArrow(x, y, angle + Math.PI / 2, 'rgba(100, 200, 255, 0.6)', false);
    }
    
    // Outer orbit arrows (counter-clockwise - 4 arrows)
    for (let i = 0; i < 4; i++) {
      const angle = (i / 4) * 2 * Math.PI;
      const x = centerX + Math.cos(angle) * config.outerOrbitRadius;
      const y = centerY + Math.sin(angle) * config.outerOrbitRadius;
      drawArrow(x, y, angle + Math.PI / 2, 'rgba(255, 150, 100, 0.6)', true);
    }
    
    // Draw FOV cones for all observer satellites
    observerSats.forEach((obsIdx, idx) => {
      const observer = satellites[obsIdx];
      const observerPos = getPosition(observer, time);
      
      // Check if we should draw this FOV based on orbit type
      const isOuterOrbit = observer.orbitType === 'outer';
      const shouldDrawFOV = isOuterOrbit ? showSatOFOV : showTracksatFOV;
      
      if (!shouldDrawFOV) return; // Skip drawing if FOV is disabled
      
      // Colors matching detection panel borders
      const colors = [
        { stroke: 'rgba(34, 197, 94, 0.3)', fill: 'rgba(34, 197, 94, 0.05)' },     // Green - Tracksat-1
        { stroke: 'rgba(59, 130, 246, 0.3)', fill: 'rgba(59, 130, 246, 0.05)' },   // Blue - Tracksat-2
        { stroke: 'rgba(168, 85, 247, 0.3)', fill: 'rgba(168, 85, 247, 0.05)' },   // Purple - Tracksat-3
        { stroke: 'rgba(234, 179, 8, 0.3)', fill: 'rgba(234, 179, 8, 0.05)' },     // Yellow - SAT-O1
        { stroke: 'rgba(6, 182, 212, 0.3)', fill: 'rgba(6, 182, 212, 0.05)' },     // Cyan - SAT-O2
        { stroke: 'rgba(236, 72, 153, 0.3)', fill: 'rgba(236, 72, 153, 0.05)' },   // Pink - SAT-O3
        { stroke: 'rgba(249, 115, 22, 0.3)', fill: 'rgba(249, 115, 22, 0.05)' },   // Orange - SAT-O4
        { stroke: 'rgba(20, 184, 166, 0.3)', fill: 'rgba(20, 184, 166, 0.05)' },   // Teal - SAT-O5
        { stroke: 'rgba(99, 102, 241, 0.3)', fill: 'rgba(99, 102, 241, 0.05)' },   // Indigo - SAT-O6
        { stroke: 'rgba(244, 63, 94, 0.3)', fill: 'rgba(244, 63, 94, 0.05)' },     // Rose - SAT-O7
        { stroke: 'rgba(132, 204, 22, 0.3)', fill: 'rgba(132, 204, 22, 0.05)' }    // Lime - SAT-O8
      ];
      
      const color = colors[idx];
      
      // Draw FOV cone
      ctx.strokeStyle = color.stroke;
      ctx.fillStyle = color.fill;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(centerX + observerPos.x, centerY + observerPos.y);
      
      // Outer orbit satellites (SAT-O series) point inward toward Earth
      // Inner orbit satellites (Tracksat) point outward along their orbit tangent
      const fovAngle = isOuterOrbit ? observerPos.angle + Math.PI : observerPos.angle;
      
      const fovStart = fovAngle - config.cameraFOV / 2;
      const fovEnd = fovAngle + config.cameraFOV / 2;
      ctx.arc(centerX + observerPos.x, centerY + observerPos.y, 150, fovStart, fovEnd);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    });
    
    // Draw debris
    debris.forEach(deb => {
      const pos = getPosition(deb, time);
      const screenX = centerX + pos.x;
      const screenY = centerY + pos.y;
      
      // Check if visible from any observer
      let visibleFromAny = false;
      observerSats.forEach(obsIdx => {
        const observer = satellites[obsIdx];
        const observerPos = getPosition(observer, time);
        const isOuterOrbit = observer.orbitType === 'outer';
        const fovAngle = isOuterOrbit ? observerPos.angle + Math.PI : observerPos.angle;
        const inFOV = isInFOV(observerPos, pos, fovAngle, config.cameraFOV);
        const distance = Math.sqrt(
          Math.pow(pos.x - observerPos.x, 2) + 
          Math.pow(pos.y - observerPos.y, 2)
        );
        
        const glintVisible = Math.sin(time * deb.tumbleRate) > 0.7;
        const isFOVEnabled = isOuterOrbit ? showSatOFOV : showTracksatFOV;
        
        // Check if line of sight is blocked by Earth
        const blocked = isBlockedByEarth(observerPos, pos, config.earthRadius);
        
        if (inFOV && distance < config.beaconRange && glintVisible && isFOVEnabled && !blocked) {
          visibleFromAny = true;
          // Draw detection line
          ctx.strokeStyle = 'rgba(251, 191, 36, 0.5)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(centerX + observerPos.x, centerY + observerPos.y);
          ctx.lineTo(screenX, screenY);
          ctx.stroke();
        }
      });
      
      // Draw debris - show glint if visible from ANY observer with FOV enabled
      const glintVisible = Math.sin(time * deb.tumbleRate) > 0.7;
      ctx.fillStyle = (glintVisible && visibleFromAny) ? '#fbbf24' : '#6b7280';
      ctx.beginPath();
      ctx.arc(screenX, screenY, 2, 0, Math.PI * 2);
      ctx.fill();
      
      // Label only if visible
      if (visibleFromAny) {
        ctx.fillStyle = '#9ca3af';
        ctx.font = '8px monospace';
        ctx.fillText(deb.id, screenX + 5, screenY - 5);
      }
    });
    
    // Draw satellites
    satellites.forEach((sat, idx) => {
      const pos = getPosition(sat, time);
      const screenX = centerX + pos.x;
      const screenY = centerY + pos.y;
      const isObserver = observerSats.includes(idx);
      
      // Determine observer color - matching detection panels and FOV cones
      let observerColor = '#3b82f6';
      let observerStroke = '#2563eb';
      if (isObserver) {
        const obsIndex = observerSats.indexOf(idx);
        const colors = [
          { fill: '#22c55e', stroke: '#16a34a' },     // Green - SAT-1
          { fill: '#3b82f6', stroke: '#2563eb' },     // Blue - SAT-2
          { fill: '#a855f7', stroke: '#9333ea' },     // Purple - SAT-3
          { fill: '#eab308', stroke: '#ca8a04' },     // Yellow - SAT-O1
          { fill: '#06b6d4', stroke: '#0891b2' },     // Cyan - SAT-O2
          { fill: '#ec4899', stroke: '#db2777' },     // Pink - SAT-O3
          { fill: '#f97316', stroke: '#ea580c' },     // Orange - SAT-O4
          { fill: '#14b8a6', stroke: '#0d9488' },     // Teal - SAT-O5
          { fill: '#6366f1', stroke: '#4f46e5' },     // Indigo - SAT-O6
          { fill: '#f43f5e', stroke: '#e11d48' },     // Rose - SAT-O7
          { fill: '#84cc16', stroke: '#65a30d' }      // Lime - SAT-O8
        ];
        observerColor = colors[obsIndex].fill;
        observerStroke = colors[obsIndex].stroke;
      }
      
      // Draw satellite body
      ctx.fillStyle = observerColor;
      ctx.strokeStyle = observerStroke;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(screenX, screenY, isObserver ? 5 : 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      
      // Draw beacon (IR LED) if active
      if (sat.beaconActive) {
        const beaconVisible = Math.sin(time * sat.beaconFreq + sat.beaconPhase) > 0;
        if (beaconVisible) {
          const beaconGradient = ctx.createRadialGradient(screenX, screenY, 0, screenX, screenY, 12);
          beaconGradient.addColorStop(0, 'rgba(220, 38, 38, 0.8)');
          beaconGradient.addColorStop(0.5, 'rgba(220, 38, 38, 0.3)');
          beaconGradient.addColorStop(1, 'rgba(220, 38, 38, 0)');
          ctx.fillStyle = beaconGradient;
          ctx.beginPath();
          ctx.arc(screenX, screenY, 12, 0, Math.PI * 2);
          ctx.fill();
        }
        
        // Draw beacon range to all observers (observers can detect other observers' beacons)
        // Only draw if observer's FOV is enabled and not blocked by Earth
        observerSats.forEach(obsIdx => {
          const observer = satellites[obsIdx];
          // Skip if this is the same satellite
          if (observer === sat) return;
          
          const observerPos = getPosition(observer, time);
          const distance = Math.sqrt(
            Math.pow(pos.x - observerPos.x, 2) + 
            Math.pow(pos.y - observerPos.y, 2)
          );
          const isOuterOrbit = observer.orbitType === 'outer';
          const fovAngle = isOuterOrbit ? observerPos.angle + Math.PI : observerPos.angle;
          const inFOV = isInFOV(observerPos, pos, fovAngle, config.cameraFOV);
          
          // Check if this observer's FOV is enabled
          const isFOVEnabled = isOuterOrbit ? showSatOFOV : showTracksatFOV;
          
          // Check if line of sight is blocked by Earth
          const blocked = isBlockedByEarth(observerPos, pos, config.earthRadius);
          
          if (inFOV && distance < config.beaconRange && beaconVisible && isFOVEnabled && !blocked) {
            ctx.strokeStyle = 'rgba(220, 38, 38, 0.4)';
            ctx.lineWidth = 1;
            ctx.setLineDash([5, 3]);
            ctx.beginPath();
            ctx.moveTo(centerX + observerPos.x, centerY + observerPos.y);
            ctx.lineTo(screenX, screenY);
            ctx.stroke();
            ctx.setLineDash([]);
          }
        });
      }
      
      // Label
      ctx.fillStyle = isObserver ? observerColor : '#60a5fa';
      ctx.font = isObserver ? 'bold 10px monospace' : '9px monospace';
      ctx.fillText(sat.id, screenX + 10, screenY - 7);
      
      if (isObserver) {
        ctx.font = '8px monospace';
        ctx.fillText('(OBS)', screenX + 10, screenY + 4);
      }
    });
    
  }, [time, observerSats, satellites, debris, canvasSize, showTracksatFOV, showSatOFOV]);

  const formatRange = (range) => {
    if (range === null || range === undefined) return 'N/A';
    return `${Math.round(range)}km`;
  };

  const calculateError = (actual, estimated) => {
    if (!estimated || !actual) return 'N/A';
    const error = Math.abs((estimated - actual) / actual) * 100;
    return `${error.toFixed(1)}%`;
  };

            const colors = [
              { name: 'Yellow', color: '#eab308', bg: 'rgba(234, 179, 8, 0.1)' },     // SAT-O1
              { name: 'Cyan', color: '#06b6d4', bg: 'rgba(6, 182, 212, 0.1)' },       // SAT-O2
              { name: 'Pink', color: '#ec4899', bg: 'rgba(236, 72, 153, 0.1)' },      // SAT-O3
              { name: 'Orange', color: '#f97316', bg: 'rgba(249, 115, 22, 0.1)' },    // SAT-O4
              { name: 'Teal', color: '#14b8a6', bg: 'rgba(20, 184, 166, 0.1)' },      // SAT-O5
              { name: 'Indigo', color: '#6366f1', bg: 'rgba(99, 102, 241, 0.1)' },    // SAT-O6
              { name: 'Rose', color: '#f43f5e', bg: 'rgba(244, 63, 94, 0.1)' },       // SAT-O7
              { name: 'Lime', color: '#84cc16', bg: 'rgba(132, 204, 22, 0.1)' }       // SAT-O8
            ];
            const colorTheme = colors[idx];

            return (
              <div key={obsIdx} style={{ background: '#1e293b', borderRadius: '8px', padding: '15px', border: `2px solid ${colorTheme.color}` }}>
                <h2 style={{ fontSize: '16px', fontWeight: '600', marginBottom: '12px', color: colorTheme.color, textAlign: 'center' }}>
                  {sat.id}
                </h2>

                {/* Star Tracker */}
                <div style={{ marginBottom: '12px' }}>
                  <h3 style={{ fontSize: '12px', fontWeight: '600', marginBottom: '8px', color: '#60a5fa', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                    <span>Star Tracker</span>
                    <span style={{ fontSize: '11px', color: '#94a3b8', fontWeight: 'normal' }}>
                      {satDetectionData.starTracker.length} obj
                    </span>
                  </h3>
                  <div style={{ background: '#0f172a', borderRadius: '4px', padding: '8px', height: '120px', overflowY: 'auto' }}>
                    {satDetectionData.starTracker.length === 0 ? (
                      <div style={{ color: '#64748b', fontSize: '11px', textAlign: 'center', paddingTop: '45px' }}>
                        No objects
                      </div>
                    ) : (
                      satDetectionData.starTracker.slice(0, 4).map((det, i) => (
                        <div 
                          key={i}
                          style={{
                            padding: '4px 6px',
                            background: '#1e293b',
                            borderRadius: '3px',
                            marginBottom: '4px',
                            fontSize: '10px'
                          }}
                        >
                          <div style={{ fontWeight: '600', color: '#fff', marginBottom: '1px' }}>{det.id}</div>
                          <div style={{ color: '#94a3b8', fontSize: '9px' }}>
                            {det.type} • {(det.angularPosition * 180 / Math.PI).toFixed(1)}°
                          </div>
                        </div>
                      ))
                    )}
                  </div>
                </div>

                {/* IR Camera */}
                <div style={{ marginBottom: '12px' }}>
                  <h3 style={{ fontSize: '12px', fontWeight: '600', marginBottom: '8px', color: '#dc2626', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                    <span>IR (850nm)</span>
                    <span style={{ fontSize: '11px', color: '#94a3b8', fontWeight: 'normal' }}>
                      {satDetectionData.irCamera.length} det
                    </span>
                  </h3>
                  <div style={{ background: '#0f172a', borderRadius: '4px', padding: '8px', height: '120px', overflowY: 'auto' }}>
                    {satDetectionData.irCamera.length === 0 ? (
                      <div style={{ color: '#64748b', fontSize: '11px', textAlign: 'center', paddingTop: '45px' }}>
                        No beacons
                      </div>
                    ) : (
                      satDetectionData.irCamera.slice(0, 4).map((det, i) => (
                        <div 
                          key={i}
                          style={{
                            padding: '4px 6px',
                            background: '#1e293b',
                            borderRadius: '3px',
                            marginBottom: '4px',
                            fontSize: '10px'
                          }}
                        >
                          <div style={{ fontWeight: '600', color: '#fff', marginBottom: '1px' }}>{det.id}</div>
                          <div style={{ color: '#94a3b8', fontSize: '9px' }}>
                            {(det.beaconStrength * 100).toFixed(0)}%
                            {det.modulation > 0 ? ` • ${det.modulation}Hz` : ' • Glint'}
                          </div>
                        </div>
                      ))
                    )}
                  </div>
                </div>

                {/* Range Estimates */}
                <div>
                  <h3 style={{ fontSize: '12px', fontWeight: '600', marginBottom: '8px', color: '#22c55e', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                    <span>Ranges</span>
                    <span style={{ fontSize: '11px', color: '#94a3b8', fontWeight: 'normal' }}>
                      {satDetectionData.rangeEstimates.length}
                    </span>
                  </h3>
                  <div style={{ background: '#0f172a', borderRadius: '4px', padding: '8px', height: '150px', overflowY: 'auto' }}>
                    {satDetectionData.rangeEstimates.length === 0 ? (
                      <div style={{ color: '#64748b', fontSize: '11px', textAlign: 'center', paddingTop: '60px' }}>
                        No estimates
                      </div>
                    ) : (
                      satDetectionData.rangeEstimates.slice(0, 3).map((est, i) => (
                        <div 
                          key={i}
                          style={{
                            padding: '6px',
                            background: '#1e293b',
                            borderRadius: '3px',
                            marginBottom: '4px',
                            fontSize: '9px'
                          }}
                        >
                          <div style={{ fontWeight: '600', color: '#fff', marginBottom: '3px', fontSize: '10px' }}>{est.id}</div>
                          <table style={{ width: '100%', borderCollapse: 'collapse' }}>
                            <tbody>
                              <tr>
                                <td style={{ color: '#94a3b8', padding: '1px 0', fontSize: '9px' }}>Act:</td>
                                <td style={{ color: '#fff', textAlign: 'right', padding: '1px 0', fontSize: '9px' }}>
                                  {formatRange(est.actual)}
                                </td>
                              </tr>
                              {est.photometric && (
                                <tr>
                                  <td style={{ color: '#94a3b8', padding: '1px 0', fontSize: '9px' }}>Pho:</td>
                                  <td style={{ color: '#fbbf24', textAlign: 'right', padding: '1px 0', fontSize: '9px' }}>
                                    {formatRange(est.photometric)} <span style={{color: '#64748b', fontSize: '8px'}}>({calculateError(est.actual, est.photometric)})</span>
                                  </td>
                                </tr>
                              )}
                              <tr>
                                <td style={{ color: '#94a3b8', padding: '1px 0', fontSize: '9px' }}>Geo:</td>
                                <td style={{ color: '#60a5fa', textAlign: 'right', padding: '1px 0', fontSize: '9px' }}>
                                  {formatRange(est.geometric)} <span style={{color: '#64748b', fontSize: '8px'}}>({calculateError(est.actual, est.geometric)})</span>
                                </td>
                              </tr>
                            </tbody>
                          </table>
                        </div>
                      ))
                    )}
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      </div>

      {/* Ranging Methods Explanation */}
      <div style={{ background: '#1e293b', borderRadius: '8px', padding: '25px' }}>
        <h2 style={{ fontSize: '20px', fontWeight: '600', marginBottom: '20px', color: '#fff', textAlign: 'center' }}>
          Ranging Methods Explained
        </h2>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '20px' }}>
          {/* Photometric Ranging */}
          <div style={{ background: '#0f172a', borderRadius: '6px', padding: '20px', border: '2px solid #fbbf24' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: '10px', marginBottom: '15px' }}>
              <div style={{ width: '12px', height: '12px', borderRadius: '50%', background: '#fbbf24' }}></div>
              <h3 style={{ fontSize: '16px', fontWeight: '600', color: '#fbbf24', margin: 0 }}>
                Photometric Ranging
              </h3>
            </div>
            <div style={{ fontSize: '13px', lineHeight: '1.7', color: '#cbd5e1' }}>
              <div style={{ marginBottom: '12px' }}>
                <strong style={{ color: '#fff' }}>Principle:</strong> Uses brightness of IR beacon to estimate distance via inverse square law
              </div>
              <div style={{ marginBottom: '12px' }}>
                <strong style={{ color: '#fff' }}>Formula:</strong> <code style={{ background: '#1e293b', padding: '2px 6px', borderRadius: '3px', fontSize: '12px' }}>Range = √(Power/Intensity)</code>
              </div>
              <div style={{ marginBottom: '12px' }}>
                <strong style={{ color: '#fff' }}>Requirements:</strong>
                <ul style={{ margin: '4px 0', paddingLeft: '20px' }}>
                  <li>Known beacon output power</li>
                  <li>Calibrated sensor</li>
                  <li>Active IR beacon at 850nm</li>
                </ul>
              </div>
              <div style={{ marginBottom: '12px' }}>
                <strong style={{ color: '#fff' }}>Accuracy:</strong> ±10-20% typical
              </div>
              <div style={{ marginBottom: '12px' }}>
                <strong style={{ color: '#fff' }}>Best for:</strong> Cooperative satellites with beacons
              </div>
              <div>
                <strong style={{ color: '#fff' }}>Limitations:</strong> Requires beacon; affected by sensor calibration errors
              </div>
            </div>
          </div>

          {/* Geometric Ranging */}
          <div style={{ background: '#0f172a', borderRadius: '6px', padding: '20px', border: '2px solid #60a5fa' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: '10px', marginBottom: '15px' }}>
              <div style={{ width: '12px', height: '12px', borderRadius: '50%', background: '#60a5fa' }}></div>
              <h3 style={{ fontSize: '16px', fontWeight: '600', color: '#60a5fa', margin: 0 }}>
                Geometric Ranging
              </h3>
            </div>
            <div style={{ fontSize: '13px', lineHeight: '1.7', color: '#cbd5e1' }}>
              <div style={{ marginBottom: '12px' }}>
                <strong style={{ color: '#fff' }}>Principle:</strong> Triangulation using angular measurements from multiple positions
              </div>
              <div style={{ marginBottom: '12px' }}>
                <strong style={{ color: '#fff' }}>Method:</strong> Satellite moves along orbit, creating baseline for triangulation
              </div>
              <div style={{ marginBottom: '12px' }}>
                <strong style={{ color: '#fff' }}>Requirements:</strong>
                <ul style={{ margin: '4px 0', paddingLeft: '20px' }}>
                  <li>Precise angular measurements</li>
                  <li>Known observer positions</li>
                  <li>Multiple observation points</li>
                </ul>
              </div>
              <div style={{ marginBottom: '12px' }}>
                <strong style={{ color: '#fff' }}>Accuracy:</strong> ±1-5% typical
              </div>
              <div style={{ marginBottom: '12px' }}>
                <strong style={{ color: '#fff' }}>Best for:</strong> High-precision ranging with good geometry
              </div>
              <div>
                <strong style={{ color: '#fff' }}>Advantages:</strong> Works for any detectable object; most accurate method
              </div>
            </div>
          </div>

          {/* Angular Rate Ranging */}
          <div style={{ background: '#0f172a', borderRadius: '6px', padding: '20px', border: '2px solid #22c55e' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: '10px', marginBottom: '15px' }}>
              <div style={{ width: '12px', height: '12px', borderRadius: '50%', background: '#22c55e' }}></div>
              <h3 style={{ fontSize: '16px', fontWeight: '600', color: '#22c55e', margin: 0 }}>
                Angular Rate Ranging
              </h3>
            </div>
            <div style={{ fontSize: '13px', lineHeight: '1.7', color: '#cbd5e1' }}>
              <div style={{ marginBottom: '12px' }}>
                <strong style={{ color: '#fff' }}>Principle:</strong> Measures how fast an object moves across the field of view to estimate distance
              </div>
              <div style={{ marginBottom: '12px' }}>
                <strong style={{ color: '#fff' }}>Formula:</strong> <code style={{ background: '#1e293b', padding: '2px 6px', borderRadius: '3px', fontSize: '12px' }}>Range = Velocity / Angular Rate</code>
              </div>
              <div style={{ marginBottom: '12px' }}>
                <strong style={{ color: '#fff' }}>How it works:</strong>
                <ul style={{ margin: '4px 0', paddingLeft: '20px' }}>
                  <li>Track object motion across frames</li>
                  <li>Measure angular velocity (deg/sec)</li>
                  <li>Estimate perpendicular velocity</li>
                  <li>Calculate distance from ratio</li>
                </ul>
              </div>
              <div style={{ marginBottom: '12px' }}>
                <strong style={{ color: '#fff' }}>Accuracy:</strong> ±10-15% typical
              </div>
              <div style={{ marginBottom: '12px' }}>
                <strong style={{ color: '#fff' }}>Best for:</strong> Non-cooperative debris via sun glint detection
              </div>
              <div>
                <strong style={{ color: '#fff' }}>Advantages:</strong> No beacon required; works with any moving detectable object; high frame rate camera excels at this
              </div>
            </div>
          </div>
        </div>

        {/* Additional note */}
        <div style={{ marginTop: '20px', padding: '15px', background: 'rgba(59, 130, 246, 0.1)', borderRadius: '6px', borderLeft: '4px solid #3b82f6' }}>
          <div style={{ fontSize: '13px', color: '#cbd5e1', lineHeight: '1.6' }}>
            <strong style={{ color: '#60a5fa' }}>Note:</strong> For non-cooperative debris without beacons, angular rate ranging is the primary method, using sun glint detections tracked by the high-speed IR camera. 
            For beaconed satellites, photometric and geometric methods can be combined (fused) to achieve better accuracy. 
            Multi-satellite observations significantly improve all ranging methods by providing longer baselines and different viewing geometries.
          </div>
        </div>
      </div>

      {/* Range vs Time Plot */}
      <div style={{ background: '#1e293b', borderRadius: '8px', padding: '25px', marginTop: '20px' }}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '20px' }}>
          <h2 style={{ fontSize: '20px', fontWeight: '600', color: '#fff', margin: 0 }}>
            Range vs Time Plot
          </h2>
          <div style={{ display: 'flex', alignItems: 'center', gap: '15px' }}>
            <label style={{ color: '#94a3b8', fontSize: '14px' }}>Select Object:</label>
            <select
              value={selectedPlotObject}
              onChange={(e) => {
                setSelectedPlotObject(e.target.value);
                setRangeHistory({}); // Clear history when changing object
              }}
              style={{
                padding: '6px 12px',
                background: '#0f172a',
                color: '#fff',
                border: '1px solid #334155',
                borderRadius: '4px',
                fontSize: '14px',
                cursor: 'pointer'
              }}
            >
              <optgroup label="Tracksat Series">
                {satellites.slice(0, 3).map((sat) => (
                  <option key={sat.id} value={sat.id}>{sat.id}</option>
                ))}
              </optgroup>
              <optgroup label="SAT-O Series">
                {satellites.slice(3, 11).map((sat) => (
                  <option key={sat.id} value={sat.id}>{sat.id}</option>
                ))}
              </optgroup>
              <optgroup label="Inner Orbit Debris">
                {debris.filter(d => d.orbitType === 'inner').map((deb) => (
                  <option key={deb.id} value={deb.id}>{deb.id}</option>
                ))}
              </optgroup>
              <optgroup label="Outer Orbit Debris">
                {debris.filter(d => d.orbitType === 'outer').map((deb) => (
                  <option key={deb.id} value={deb.id}>{deb.id}</option>
                ))}
              </optgroup>
            </select>

            {/* Plotting toggle button */}
            <button
              onClick={() => setIsPlotting(!isPlotting)}
              style={{
                padding: '6px 16px',
                background: isPlotting ? '#dc2626' : '#22c55e',
                color: '#fff',
                border: 'none',
                borderRadius: '4px',
                cursor: 'pointer',
                fontSize: '14px',
                fontWeight: '500',
                display: 'flex',
                alignItems: 'center',
                gap: '6px'
              }}
            >
              {isPlotting ? <><Pause size={14} /> Stop Recording</> : <><Play size={14} /> Start Recording</>}
            </button>

            {/* Clear plot button */}
            <button
              onClick={() => setRangeHistory({})}
              style={{
                padding: '6px 16px',
                background: '#3b82f6',
                color: '#fff',
                border: 'none',
                borderRadius: '4px',
                cursor: 'pointer',
                fontSize: '14px',
                fontWeight: '500'
              }}
            >
              Clear Plot
            </button>
          </div>
        </div>

        {/* Plot Area */}
        <div style={{ background: '#0f172a', borderRadius: '8px', padding: '20px', height: '400px', position: 'relative' }}>
          {Object.keys(rangeHistory).length === 0 ? (
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', height: '100%', color: '#64748b', fontSize: '14px' }}>
              Waiting for detection of {selectedPlotObject}...
            </div>
          ) : (
            <svg width="100%" height="100%" viewBox="0 0 800 360" style={{ overflow: 'visible' }}>
              {/* Grid lines */}
              {[0, 1, 2, 3, 4].map(i => (
                <line
                  key={`grid-h-${i}`}
                  x1="60"
                  y1={40 + i * 70}
                  x2="760"
                  y2={40 + i * 70}
                  stroke="#334155"
                  strokeWidth="1"
                  strokeDasharray="2,2"
                />
              ))}
              {[0, 1, 2, 3, 4, 5, 6].map(i => (
                <line
                  key={`grid-v-${i}`}
                  x1={60 + i * 116.67}
                  y1="40"
                  x2={60 + i * 116.67}
                  y2="320"
                  stroke="#334155"
                  strokeWidth="1"
                  strokeDasharray="2,2"
                />
              ))}

              {/* Axes */}
              <line x1="60" y1="320" x2="760" y2="320" stroke="#94a3b8" strokeWidth="2" />
              <line x1="60" y1="40" x2="60" y2="320" stroke="#94a3b8" strokeWidth="2" />

              {/* Y-axis label */}
              <text x="20" y="180" fill="#cbd5e1" fontSize="14" textAnchor="middle" transform="rotate(-90, 20, 180)">
                Range (km)
              </text>

              {/* X-axis label */}
              <text x="410" y="355" fill="#cbd5e1" fontSize="14" textAnchor="middle">
                Time (s)
              </text>

              {/* Plot data */}
              {(() => {
                // Calculate global min/max for consistent scaling
                const allData = Object.values(rangeHistory).flat();
                if (allData.length === 0) return null;
                
                const allRanges = allData.map(d => d.actual);
                const allTimes = allData.map(d => d.time);
                const globalMinRange = Math.min(...allRanges);
                const globalMaxRange = Math.max(...allRanges);
                const globalMinTime = Math.min(...allTimes);
                const globalMaxTime = Math.max(...allTimes);
                const rangeSpan = globalMaxRange - globalMinRange || 100;
                const timeSpan = globalMaxTime - globalMinTime || 10;

                return Object.entries(rangeHistory).map(([key, dataPoints]) => {
                  if (dataPoints.length < 2) return null;

                  // Extract observer ID by removing the selected object from the key
                  // Key format: "ObserverId-TargetId"
                  // Remove the target ID (selectedPlotObject) from the end
                  const observerId = key.replace(`-${selectedPlotObject}`, '');

                  const colorMap = {
                    'Tracksat-1': '#22c55e',
                    'Tracksat-2': '#3b82f6',
                    'Tracksat-3': '#a855f7',
                    'SAT-O1': '#eab308',
                    'SAT-O2': '#06b6d4',
                    'SAT-O3': '#ec4899',
                    'SAT-O4': '#f97316',
                    'SAT-O5': '#14b8a6',
                    'SAT-O6': '#6366f1',
                    'SAT-O7': '#f43f5e',
                    'SAT-O8': '#84cc16'
                  };
                  const color = colorMap[observerId] || '#60a5fa';

                  // Create path using global scale - break segments when there are gaps
                  // If time gap is > 2 seconds, start a new path segment (M instead of L)
                  const timeGapThreshold = 2; // seconds
                  const pathData = dataPoints.map((d, i) => {
                    const x = 60 + ((d.time - globalMinTime) / timeSpan) * 700;
                    const y = 320 - ((d.actual - globalMinRange) / rangeSpan) * 280;
                    
                    // Start new segment if:
                    // 1. First point
                    // 2. Time gap from previous point is too large (detection was lost)
                    if (i === 0) {
                      return `M ${x} ${y}`;
                    } else {
                      const timeDiff = d.time - dataPoints[i - 1].time;
                      if (timeDiff > timeGapThreshold) {
                        return `M ${x} ${y}`; // Move without drawing line
                      } else {
                        return `L ${x} ${y}`; // Draw line
                      }
                    }
                  }).join(' ');

                  return (
                    <g key={key}>
                      <path
                        d={pathData}
                        fill="none"
                        stroke={color}
                        strokeWidth="2.5"
                        opacity="0.9"
                      />
                      {/* Label */}
                      <text
                        x="770"
                        y={320 - ((dataPoints[dataPoints.length - 1].actual - globalMinRange) / rangeSpan) * 280}
                        fill={color}
                        fontSize="12"
                        fontWeight="600"
                      >
                        {observerId}
                      </text>
                    </g>
                  );
                });
              })()}

              {/* Y-axis ticks and labels */}
              {(() => {
                const allData = Object.values(rangeHistory).flat();
                if (allData.length === 0) return null;
                const allRanges = allData.map(d => d.actual);
                const minRange = Math.min(...allRanges);
                const maxRange = Math.max(...allRanges);
                return [0, 1, 2, 3, 4].map(i => {
                  const range = minRange + (maxRange - minRange) * (i / 4);
                  return (
                    <text
                      key={`y-tick-${i}`}
                      x="55"
                      y={320 - i * 70}
                      fill="#94a3b8"
                      fontSize="11"
                      textAnchor="end"
                    >
                      {Math.round(range)}
                    </text>
                  );
                });
              })()}

              {/* X-axis ticks */}
              {(() => {
                const allData = Object.values(rangeHistory).flat();
                if (allData.length === 0) return null;
                const times = allData.map(d => d.time);
                const minTime = Math.min(...times);
                const maxTime = Math.max(...times);
                return [0, 1, 2, 3, 4, 5, 6].map(i => {
                  const t = minTime + (maxTime - minTime) * (i / 6);
                  return (
                    <text
                      key={`x-tick-${i}`}
                      x={60 + i * 116.67}
                      y="340"
                      fill="#94a3b8"
                      fontSize="11"
                      textAnchor="middle"
                    >
                      {Math.round(t)}
                    </text>
                  );
                });
              })()}
            </svg>
          )}
        </div>

        {/* Legend */}
        <div style={{ marginTop: '15px', padding: '12px', background: '#0f172a', borderRadius: '6px' }}>
          <div style={{ fontSize: '12px', color: '#cbd5e1' }}>
            <strong style={{ color: '#fff' }}>Plot shows:</strong> Actual range from each observer to <strong style={{ color: '#60a5fa' }}>{selectedPlotObject}</strong> over time. 
            Each colored line represents a different observer satellite detecting the selected object.
          </div>
        </div>
      </div>
    </div>
  );
};



    // Render the component
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<SpaceSurveillanceSimulation />);
  </script>
</body>
</html>
