<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Conjunction Assessment</title>

<style>
:root {
  --bg-main: #0b1020;
  --bg-panel: #121a33;
  --bg-table-header: #1b254b;
  --border-soft: #26346b;
  --text-main: #e6ebff;
  --text-muted: #9aa4d6;
  --accent: #6ea8ff;
  --accent-glow: rgba(110, 168, 255, 0.45);
}

body {
  margin: 0;
  padding: 32px;
  font-family: "Inter", "Segoe UI", Arial, sans-serif;
  background:
    radial-gradient(circle at 20% 15%, #1a2458 0%, transparent 40%),
    radial-gradient(circle at 80% 10%, #101a40 0%, transparent 45%),
    linear-gradient(180deg, #050816 0%, var(--bg-main) 100%);
  color: var(--text-main);
}

.panel {
  background: var(--bg-panel);
  border: 1px solid var(--border-soft);
  border-radius: 12px;
  padding: 20px;
}

input {
  width: 420px;
  padding: 10px 14px;
  border-radius: 8px;
  border: 1px solid var(--border-soft);
  background: #0c1330;
  color: var(--text-main);
}

.table-container {
  margin-top: 16px;
  height: 420px;
  overflow: auto;
  border: 1px solid var(--border-soft);
  border-radius: 8px;
}

table {
  border-collapse: collapse;
  width: 100%;
  font-size: 13px;
}

th, td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border-soft);
  white-space: nowrap;
}

th {
  background: var(--bg-table-header);
  color: var(--accent);
  position: sticky;
  top: 0;
}

.status {
  margin-top: 8px;
  font-size: 13px;
  color: var(--text-muted);
}
</style>
</head>

<body>

<h1>Conjunction CSV Inspector</h1>
<div class="panel">
  <input id="searchInput" placeholder="Search conjunctions…" disabled />
  <div class="status" id="status">Loading CSV…</div>

  <div class="table-container" id="scrollContainer">
    <table id="dataTable">
      <thead></thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<script>
const CSV_URL =
  "https://raw.githubusercontent.com/orbitorus/orbit-i-beta/refs/heads/main/sim_dataset/selected_conjunction_data.csv";

const ROW_HEIGHT = 38;
const ROWS_VISIBLE = 10;

const SEARCH_COLUMNS = [
  'conjunction_id','creation_date','tca','miss_distance',
  'relative_speed','collision_probability',
  'object1_object_designator','object1_object_name',
  'object1_international_designator','object1_object_type',
  'object2_object_designator','object2_object_name',
  'object2_international_designator','object2_object_type'
];

const HIDDEN_COLUMNS = [
  'object1_catalog_name','object2_catalog_name'
];

const table = document.getElementById("dataTable");
const thead = table.querySelector("thead");
const tbody = table.querySelector("tbody");
const searchInput = document.getElementById("searchInput");
const status = document.getElementById("status");
const scrollContainer = document.getElementById("scrollContainer");

let headers = [];
let allRows = [];
let visibleColumnIndexes = [];
let searchColumnIndexes = [];
let filteredIndexes = [];

function render(startIndex) {
  tbody.innerHTML = "";
  const end = Math.min(startIndex + ROWS_VISIBLE, filteredIndexes.length);

  for (let i = startIndex; i < end; i++) {
    const row = allRows[filteredIndexes[i]];
    const tr = document.createElement("tr");

    visibleColumnIndexes.forEach(idx => {
      const td = document.createElement("td");
      td.textContent = row[idx];
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  }

  tbody.style.transform = `translateY(${startIndex * ROW_HEIGHT}px)`;
}

fetch(CSV_URL)
  .then(r => r.text())
  .then(text => {
    const rows = text.trim().split("\n").map(r => r.split(","));
    headers = rows[0];
    allRows = rows.slice(1);

    visibleColumnIndexes = headers
      .map((h,i)=>({h,i}))
      .filter(c=>!HIDDEN_COLUMNS.includes(c.h))
      .map(c=>c.i);

    searchColumnIndexes = SEARCH_COLUMNS
      .map(c=>headers.indexOf(c))
      .filter(i=>i>=0);

    const hr = document.createElement("tr");
    visibleColumnIndexes.forEach(i=>{
      const th = document.createElement("th");
      th.textContent = headers[i];
      hr.appendChild(th);
    });
    thead.appendChild(hr);

    filteredIndexes = allRows.map((_,i)=>i);
    tbody.style.height = `${filteredIndexes.length * ROW_HEIGHT}px`;

    render(0);
    status.textContent = `Loaded ${allRows.length} conjunctions`;
    searchInput.disabled = false;
  });

scrollContainer.addEventListener("scroll", () => {
  const start = Math.floor(scrollContainer.scrollTop / ROW_HEIGHT);
  render(start);
});

searchInput.addEventListener("input", () => {
  const q = searchInput.value.toLowerCase().trim();
  filteredIndexes = allRows
    .map((r,i)=>searchColumnIndexes.some(idx=>r[idx]?.toLowerCase().includes(q))?i:-1)
    .filter(i=>i>=0);

  tbody.style.height = `${filteredIndexes.length * ROW_HEIGHT}px`;
  scrollContainer.scrollTop = 0;
  render(0);
});
</script>

</body>
</html>
