<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Constellation Size Sample Table</title>

  <!-- Tabulator library -->
  <link href="https://unpkg.com/tabulator-tables@5.5.2/dist/css/tabulator.min.css" rel="stylesheet">
  <script src="https://unpkg.com/tabulator-tables@5.5.2/dist/js/tabulator.min.js"></script>

  <style>
    body {
      background: #0b0b0b;
      color: white;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
    }

    h1 {
      text-align: center;
      padding: 20px;
      color: #ffd700;
      text-shadow: 0 0 15px #ffd700;
      font-weight: 600;
    }

    #table-container {
      width: 90%;
      margin: 0 auto 50px auto;
      background: #111;
      border-radius: 10px;
      padding: 15px;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
    }

    .tabulator {
      background-color: #1a1a1a !important;
      color: #eee;
      border: 1px solid #444;
    }

    .tabulator .tabulator-header {
      background-color: #222 !important;
      border-bottom: 1px solid #555;
    }

    .tabulator .tabulator-row {
      background-color: #1a1a1a;
    }

    .tabulator .tabulator-row.tabulator-selected {
      background-color: #333 !important;
    }

    .tabulator .tabulator-cell {
      border-right: 1px solid #333;
    }

    .tabulator .tabulator-header-filter input {
      background: #222;
      color: #fff;
      border: 1px solid #444;
      padding: 3px;
    }
  </style>
</head>
<body>
  <h1>Constellation Size Sample</h1>
  <div id="table-container"></div>

  <script>
    async function loadCSV(url) {
      const response = await fetch(url);
      const csv = await response.text();

      const rows = csv.trim().split('\n');
      const headers = rows[0].split(',');
      const data = rows.slice(1).map(row => {
        const values = row.split(',');
        const obj = {};
        headers.forEach((header, i) => obj[header.trim()] = values[i]?.trim());
        return obj;
      });

      new Tabulator("#table-container", {
        data: data,
        layout: "fitColumns",
        columns: headers.map(header => ({
          title: header,
          field: header,
          headerFilter: "input",
          sorter: "string"
        })),
        pagination: "local",
        paginationSize: 10,
        paginationSizeSelector: [10, 20, 50, 100],
        movableColumns: true,
        resizableColumns: true,
        selectable: true,
        placeholder: "Loading data...",
        rowClick: function(e, row) {
          console.log("Clicked Row:", row.getData());
        },
      });
    }

    // Load your raw CSV file
    loadCSV("https://raw.githubusercontent.com/orbitorus/orbit-i-beta/refs/heads/main/dataset/constellation_size_sample.csv");
  </script>
</body>
</html>
