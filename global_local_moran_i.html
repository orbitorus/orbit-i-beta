<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Local Moran’s I Demo</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
    body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #0b132b;
        color: #e5e7eb;
        margin: 0;
        padding: 2rem;
    }

    .grid-container {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2rem;
    }

    .card {
        background: rgba(15, 23, 42, 0.85);
        padding: 1.25rem;
        border-radius: 10px;
        border: 1px solid rgba(148, 163, 184, 0.2);
    }

    h3 {
        margin: 0 0 1rem 0;
        font-weight: 600;
    }

    .legend {
        margin-top: 1.5rem;
        padding: 0.75rem;
        border-radius: 6px;
        background: rgba(10, 25, 41, 0.6);
        border: 1px solid rgba(251, 191, 36, 0.3);
        font-size: 0.85rem;
    }

    .legend-row {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
    }
</style>
</head>

<body>

<div class="grid-container">

    <!-- MORAN SCATTERPLOT -->
    <div class="card">
        <h3>Moran Scatterplot (Local Moran’s I)</h3>

        <div style="min-height: 350px; margin-bottom: 1.5rem;">
            <canvas id="moranChart"></canvas>
        </div>

        <div class="legend">
            <div style="margin-bottom:0.5rem;">
                <strong>X:</strong> Standardized value (z) |
                <strong>Y:</strong> Spatial lag
            </div>
            <div class="legend-row">
                <div><span style="color:#22c55e">●</span> HH (cluster)</div>
                <div><span style="color:#ef4444">●</span> LL (cluster)</div>
                <div><span style="color:#f59e0b">●</span> HL (outlier)</div>
                <div><span style="color:#3b82f6">●</span> LH (outlier)</div>
            </div>
        </div>
    </div>

    <!-- INFO -->
    <div class="card">
        <h3>Detected Spatial Outliers</h3>
        <div id="outlierList" style="font-size:0.9rem; line-height:1.5;"></div>
    </div>

</div>

<script>
/* -----------------------------
   SAMPLE DATA (grid)
------------------------------ */
const data = [];
const size = 6;
let id = 0;

for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
        data.push({
            id: id++,
            x,
            y,
            value: Math.random() * 100
        });
    }
}

/* Inject a few spatial outliers */
data[8].value = 95;
data[9].value = 10;
data[22].value = 90;

/* -----------------------------
   LOCAL MORAN’S I
------------------------------ */
function calculateLocalMoran(points, permutations = 199) {
    const n = points.length;
    const values = points.map(p => p.value);

    const mean = values.reduce((a,b) => a+b,0) / n;
    const std = Math.sqrt(values.reduce((s,v)=>s+(v-mean)**2,0)/n);
    const z = values.map(v => (v - mean) / std);

    const neighbors = points.map(p =>
        points
            .map((q, j) => {
                if (p.id === q.id) return null;
                const d = Math.hypot(p.x - q.x, p.y - q.y);
                return d <= 1.5 ? j : null;
            })
            .filter(j => j !== null)
    );

    const results = points.map((p, i) => {
        const lag = neighbors[i].reduce((s,j)=>s+z[j],0) / neighbors[i].length;
        const Ii = z[i] * lag;

        let extreme = 0;
        for (let k=0;k<permutations;k++){
            const shuffled = [...z].sort(()=>Math.random()-0.5);
            const permLag = neighbors[i].reduce((s,j)=>s+shuffled[j],0) / neighbors[i].length;
            const permIi = shuffled[i] * permLag;
            if (Math.abs(permIi) >= Math.abs(Ii)) extreme++;
        }

        return {
            ...p,
            zi: z[i],
            lagZi: lag,
            Ii,
            p: (extreme+1)/(permutations+1)
        };
    });

    return results;
}

const local = calculateLocalMoran(data);

/* -----------------------------
   SCATTER DATA
------------------------------ */
function quadrantColor(d){
    if (d.zi > 0 && d.lagZi > 0) return '#22c55e';
    if (d.zi < 0 && d.lagZi < 0) return '#ef4444';
    if (d.zi > 0 && d.lagZi < 0) return '#f59e0b';
    return '#3b82f6';
}

const scatterData = local.map(d => ({
    x: d.zi,
    y: d.lagZi,
    backgroundColor: quadrantColor(d),
    radius: d.p < 0.05 ? 7 : 4
}));

/* -----------------------------
   CHART
------------------------------ */
new Chart(document.getElementById('moranChart'), {
    type: 'scatter',
    data: {
        datasets: [{
            data: scatterData
        }]
    },
    options: {
        maintainAspectRatio: false,
        scales: {
            x: { title: { display:true, text:'z' } },
            y: { title: { display:true, text:'Spatial lag' } }
        },
        plugins: {
            legend: { display:false },
            tooltip: {
                callbacks: {
                    label: ctx => {
                        const d = local[ctx.dataIndex];
                        return `Ii=${d.Ii.toFixed(2)}, p=${d.p.toFixed(3)}`;
                    }
                }
            }
        }
    }
});

/* -----------------------------
   OUTLIER LIST
------------------------------ */
const outliers = local.filter(d =>
    d.p < 0.05 &&
    ((d.zi > 0 && d.lagZi < 0) || (d.zi < 0 && d.lagZi > 0))
);

document.getElementById('outlierList').innerHTML =
    outliers.length
    ? outliers.map(d =>
        `Point ${d.id}: ${d.zi>0?'HL':'LH'} (p=${d.p.toFixed(3)})`
      ).join('<br>')
    : 'No statistically significant spatial outliers.';
</script>

</body>
</html>
