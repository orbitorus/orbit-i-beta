<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Satellite Dashboard</title>
  <style>
    body {
      margin: 0;
      background: black;
      font-family: sans-serif;
      color: white;
      overflow: hidden;
    }

    #chart {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transition: all 1s ease;
      z-index: 1;
    }

    #side-panel {
      position: fixed;
      top: 0;
      right: -30%;
      width: 30%;
      height: 100%;
      background: rgba(20, 20, 20, 0.95);
      color: white;
      box-shadow: -2px 0 10px rgba(0, 0, 0, 0.7);
      transition: right 1s ease;
      overflow-y: auto;
      padding: 20px;
      z-index: 2;
    }

    #side-panel.open {
      right: 0;
    }

    #menu-button {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: white;
      padding: 10px 15px;
      font-size: 16px;
      cursor: pointer;
      z-index: 3;
      border-radius: 8px;
      transition: background 0.3s;
    }

    #menu-button:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    h1 {
      text-align: left;
      margin-bottom: 10px;
    }

    .section {
      margin-top: 30px;
    }

    .chart-placeholder {
      width: 100%;
      height: 200px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <button id="menu-button">☰</button>

  <div id="chart"></div>

  <div id="side-panel">
    <h1>Summary Dashboard</h1>
    <div class="section">
      <h2>Track and Monitor</h2>
      <div class="chart-placeholder"></div>
    </div>
    <div class="section">
      <h2>Data Insights</h2>
      <div class="chart-placeholder"></div>
    </div>
  </div>

  <script src="https://unpkg.com/globe.gl"></script>
  <script>
    const chartDiv = document.getElementById('chart');
    const sidePanel = document.getElementById('side-panel');
    const menuButton = document.getElementById('menu-button');

    const world = Globe()(chartDiv)
      .globeImageUrl('//unpkg.com/three-globe/example/img/earth-night.jpg')
      .pointsData([...Array(2000).keys()].map(() => ({
        lat: (Math.random() - 0.5) * 180,
        lng: (Math.random() - 0.5) * 360,
        size: Math.random() * 1.5,
        color: 'cyan'
      })))
      .pointAltitude('size')
      .pointColor('color');

    // Initial render size
    world.width(chartDiv.clientWidth);
    world.height(chartDiv.clientHeight);

    menuButton.addEventListener('click', () => {
      const isOpen = sidePanel.classList.toggle('open');

      if (isOpen) {
        // Move globe left and shrink width
        chartDiv.style.width = "50%";
        chartDiv.style.left = "0";
      } else {
        // Reset globe to full center
        chartDiv.style.width = "100%";
        chartDiv.style.left = "0";
      }

      // Trigger resize after animation
      setTimeout(() => {
        world.width(chartDiv.clientWidth);
        world.height(chartDiv.clientHeight);
      }, 800); // sync with CSS transition
    });
  </script>
</body>
</html>
