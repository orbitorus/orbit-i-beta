<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Moran Scatterplot – Working Baseline</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>

<style>
body {
    background:#0b1220;
    color:#e5e7eb;
    font-family: system-ui, sans-serif;
    padding:40px;
}

.card {
    max-width:800px;
    margin:auto;
    background:#111827;
    border-radius:8px;
    padding:20px;
    border:1px solid rgba(251,191,36,.3);
}

.legend {
    margin-top:16px;
    padding:12px;
    background:rgba(10,25,41,.6);
    border-radius:6px;
    font-size:14px;
}
</style>
</head>

<body>

<div class="card">
    <h3>Moran Scatterplot (Working)</h3>

    <div style="height:420px">
        <canvas id="moranScatterChart"></canvas>
    </div>

    <div class="legend">
        X: standardized value (z)<br>
        Y: spatial lag (neighbor mean)
    </div>
</div>

<script>
/* -----------------------
   Create grid data
------------------------ */
const data = [];
for (let x = 0; x < 10; x++) {
    for (let y = 0; y < 10; y++) {
        data.push({ x, y, value: Math.random() * 100 });
    }
}

/* -----------------------
   Standardize values
------------------------ */
const values = data.map(d => d.value);
const mean = values.reduce((a,b)=>a+b,0) / values.length;
const std  = Math.sqrt(values.reduce((s,v)=>s+(v-mean)**2,0) / values.length);

const z = values.map(v => (v - mean) / std);

/* -----------------------
   Spatial lag (queen)
------------------------ */
function neighbors(i) {
    return data
        .map((d,j)=>{
            if (i===j) return null;
            const dx = data[i].x - d.x;
            const dy = data[i].y - d.y;
            return Math.sqrt(dx*dx+dy*dy) <= 1.5 ? j : null;
        })
        .filter(j => j !== null);
}

const points = z.map((zi,i)=>{
    const nbrs = neighbors(i);
    const lag = nbrs.length
        ? nbrs.reduce((s,j)=>s+z[j],0) / nbrs.length
        : 0;

    return { x: zi, y: lag };
});

/* -----------------------
   Render Chart
------------------------ */
const ctx = document.getElementById('moranScatterChart').getContext('2d');

new Chart(ctx, {
    type: 'scatter',
    data: {
        datasets: [{
            data: points,
            pointRadius: 4,
            backgroundColor: '#60a5fa'
        }]
    },
    options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
            x: {
                title: { display: true, text: 'Standardized Value (z)' }
            },
            y: {
                title: { display: true, text: 'Spatial Lag' }
            }
        }
    }
});
</script>

</body>
</html>
