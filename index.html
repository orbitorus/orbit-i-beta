<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Satellite Constellations Overview</title>
  <style>
    body { 
      margin: 0; 
      background: black; 
      font-family: 'Segoe UI', Roboto, sans-serif; 
      color: white; 
      overflow-x: hidden;
    }

    /* Top banner (main nav) */
    #top-banner {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 50px;
      background: rgba(40, 40, 40, 0.95);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 20px;
      z-index: 20;
      font-size: 20px;
      font-weight: bold;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
    }

    #top-banner span { flex-shrink: 0; }

    #top-banner button, #top-banner a {
      background-color: #1e90ff;
      border: none;
      color: white;
      padding: 6px 14px;
      font-size: 14px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
      text-decoration: none;
    }

    #top-banner button:hover:not(:disabled), #top-banner a:hover {
      background-color: #63b3ff;
    }

    #top-banner button:disabled {
      opacity: 0.4;
      cursor: default;
    }

    #top-banner select {
      background-color: #222;
      color: white;
      border: 1px solid #555;
      padding: 5px 10px;
      font-size: 14px;
      border-radius: 4px;
      cursor: pointer;
    }

    /* Top-right links moved slightly toward center */
    #top-links {
      margin-left: 10%;
      display: flex;
      gap: 10px;
    }

    /* Temporary info banner */
    #info-banner {
      position: fixed;
      top: 50px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 900px;
      background: linear-gradient(90deg, rgba(50,50,50,0.9), rgba(20,20,20,0.9));
      color: #e0e0e0;
      text-align: center;
      padding: 14px 20px;
      font-size: 15px;
      border-radius: 8px;
      margin-top: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      opacity: 0;
      z-index: 30;
      transition: opacity 0.8s ease, transform 0.8s ease;
      backdrop-filter: blur(4px);
    }

    #info-banner.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    #info-banner.hide {
      opacity: 0;
      transform: translateX(-50%) translateY(-10px);
    }

    #loading {
      position: fixed;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.1);
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 14px;
      display: none;
      z-index: 15;
    }

    #time-log {
      position: absolute;
      font-size: 12px;
      padding: 5px;
      border-radius: 3px;
      background-color: rgba(200, 200, 200, 0.1);
      color: lavender;
      bottom: 10px;
      right: 10px;
    }

    #chart { 
      width: 100%; 
      height: 100vh; 
      margin-top: 50px; 
      transition: width 0.5s ease; 
    }

    /* Slide-out side panel */
    #side-panel {
      position: fixed;
      top: 0;
      right: 0;
      width: 50%;
      height: 100%;
      background: rgba(20, 20, 20, 0.95);
      transform: translateX(100%);
      transition: transform 0.4s ease;
      padding: 20px;
      box-shadow: -4px 0 12px rgba(0, 0, 0, 0.5);
      z-index: 2000;
      overflow: auto;
    }

    #side-panel.active {
      transform: translateX(0);
    }

    #side-panel iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/globe.gl"></script>
</head>
<body>
  <!-- Top Navigation Banner -->
  <div id="top-banner">
    <span>Major LEO Constellation Visualization</span>

    <select id="constellation-select">
      <option value="all">🌐 All Active Satellites</option>
      <option value="oneweb">🇬🇧 OneWeb</option>
      <option value="kuiper">🇺🇸 Kuiper</option>
      <option value="starlink">🇺🇸 Starlink</option>
      <option value="iridium-NEXT">🇺🇸 Iridium-NEXT</option>
      <option value="hulianwang">🇨🇳 Hulianwang</option>
      <option value="qianfan">🇨🇳 Qianfan</option>
      <option value="planet">🇺🇸 Planet</option>
    </select>

    <button id="orbit-btn" disabled>Orbit Analysis</button>

    <div id="top-links">
      <a href="https://orbitorus.grafana.net/public-dashboards/b8a8e84a4de84bb2b02b57b866dd158d"
         target="_blank"
         rel="noopener noreferrer">
        Track and Monitor
      </a>

      <a href="https://orbitorus.grafana.net/public-dashboards/a983503e27b34b19a1efc0f8f5f4dd9c"
         target="_blank"
         rel="noopener noreferrer">
        Summary Dashboard
      </a>
    </div>
  </div>

  <!-- Temporary Info Banner -->
  <div id="info-banner">
    This website helps you in finding apparent anomalous satellites from major mega constellations.<br>
    Select interested constellation from the drop-down list above.
  </div>

  <div id="loading">Loading satellites...</div>
  <div id="chart"></div>
  <div id="time-log"></div>

  <!-- Side Panel -->
  <div id="side-panel">
    <iframe id="orbitLink" src=""></iframe>
  </div>

  <script type="module">
    import * as satellite from 'https://esm.sh/satellite.js';

    const infoBanner = document.getElementById('info-banner');
    const orbitBtn = document.getElementById("orbit-btn");
    const selectEl = document.getElementById("constellation-select");
    const sidePanel = document.getElementById("side-panel");
    const orbitLink = document.getElementById("orbitLink");
    const chart = document.getElementById("chart");

    // Show info banner
    window.addEventListener("load", () => {
      infoBanner.classList.add("show");
      setTimeout(() => {
        infoBanner.classList.add("hide");
        setTimeout(() => infoBanner.style.display = "none", 800);
      }, 10000);
    });

    const TLE_URLS = {
      starlink: 'https://celestrak.org/NORAD/elements/gp.php?GROUP=starlink&FORMAT=tle',
      kuiper: 'https://celestrak.org/NORAD/elements/gp.php?GROUP=kuiper&FORMAT=tle',
      oneweb: 'https://celestrak.org/NORAD/elements/gp.php?GROUP=oneweb&FORMAT=tle',
      "iridium-NEXT": 'https://celestrak.org/NORAD/elements/gp.php?GROUP=iridium-NEXT&FORMAT=tle',
      hulianwang: 'https://celestrak.org/NORAD/elements/gp.php?GROUP=hulianwang&FORMAT=tle',
      qianfan: 'https://celestrak.org/NORAD/elements/gp.php?GROUP=qianfan&FORMAT=tle',
      planet: 'https://celestrak.org/NORAD/elements/gp.php?GROUP=planet&FORMAT=tle'
    };

    const EARTH_RADIUS_KM = 6371;
    const TIME_STEP = 1000;
    const timeLogger = document.getElementById('time-log');
    const loading = document.getElementById('loading');

    let satDataMap = {};
    let time = new Date();
    let activeConstellation = "all";

    const world = Globe()(chart)
      .globeImageUrl('//cdn.jsdelivr.net/npm/three-globe/example/img/earth-night.jpg')
      .backgroundColor('#000')
      .showAtmosphere(true)
      .atmosphereColor('rgba(70, 120, 180, 0.3)')
      .particleLat('lat')
      .particleLng('lng')
      .particleAltitude('alt')
      .particlesColor(() => 'rgba(255,255,200,1)');

    setTimeout(() => world.pointOfView({ altitude: 3.5 }));

    setTimeout(() => {
      world.scene().traverse(obj => {
        if (obj.type === "Points" && obj.material?.onBeforeCompile) {
          obj.material.onBeforeCompile = shader => {
            shader.vertexShader = shader.vertexShader.replace('gl_PointSize = size;', 'gl_PointSize = size * 4.0;');
            shader.fragmentShader = shader.fragmentShader.replace(
              'gl_FragColor = vec4( color, opacity );',
              `
              float d = distance(gl_PointCoord, vec2(0.5,0.5));
              float alpha = smoothstep(0.5, 0.0, d);
              gl_FragColor = vec4(color.rgb, opacity*alpha);
              `
            );
          };
          obj.material.needsUpdate = true;
        }
      });
    }, 1000);

    async function fetchConstellation(name) {
      if (!name || satDataMap[name]) return;
      loading.style.display = 'block';
      const res = await fetch(TLE_URLS[name]);
      const raw = await res.text();
      const tleData = raw.replace(/\r/g, '').split(/\n(?=[^12])/).filter(d => d).map(tle => tle.split('\n'));
      const sats = tleData.map(([name, ...tle]) => ({
        satrec: satellite.twoline2satrec(...tle),
        name: name.trim().replace(/^0 /, '')
      })).filter(d => !!satellite.propagate(d.satrec, new Date())?.position);
      satDataMap[name] = sats;
      loading.style.display = 'none';
    }

    async function fetchAllConstellations() {
      loading.style.display = 'block';
      const keys = Object.keys(TLE_URLS);
      await Promise.all(keys.map(fetchConstellation));
      loading.style.display = 'none';
    }

    function updateSatPositions() {
      time = new Date(+time + TIME_STEP);
      timeLogger.innerText = time.toString();
      const gmst = satellite.gstime(time);

      Object.values(satDataMap).flat().forEach(d => {
        const eci = satellite.propagate(d.satrec, time);
        if (eci?.position) {
          const gdPos = satellite.eciToGeodetic(eci.position, gmst);
          d.lat = satellite.radiansToDegrees(gdPos.latitude);
          d.lng = satellite.radiansToDegrees(gdPos.longitude);
          d.alt = gdPos.height / EARTH_RADIUS_KM;
        } else {
          d.lat = NaN; d.lng = NaN; d.alt = NaN;
        }
      });

      let activeData = activeConstellation === "all" ? Object.values(satDataMap).flat() : satDataMap[activeConstellation] || [];
      world.particlesData([activeData.filter(d => !isNaN(d.lat))]);
    }

    (function frameTicker() {
      requestAnimationFrame(frameTicker);
      updateSatPositions();
    })();

    selectEl.addEventListener("change", async (e) => {
      activeConstellation = e.target.value;
      orbitBtn.disabled = activeConstellation === "all";

      if (activeConstellation === "all") {
        await fetchAllConstellations();
      } else {
        await fetchConstellation(activeConstellation);
      }
    });

    // Orbit Analysis button click — slide out panel
    orbitBtn.addEventListener("click", (event) => {
      if (!activeConstellation || activeConstellation === "all") return;
      event.stopPropagation();

      // Show panel
      sidePanel.classList.add("active");
      orbitLink.src = `${activeConstellation}/index3.html`;

      // Shrink globe container
      chart.style.width = "50%";
      world.renderer().setSize(chart.offsetWidth, chart.offsetHeight);

      // Smooth camera shift
      world.pointOfView({ lat: 0, lng: 0, altitude: 2.5 }, 1000);
    });

    // Clicking outside closes the panel
    document.addEventListener("click", (event) => {
      if (!sidePanel.contains(event.target) && event.target !== orbitBtn) {
        sidePanel.classList.remove("active");

        // Restore globe full size
        chart.style.width = "100%";
        world.renderer().setSize(chart.offsetWidth, chart.offsetHeight);

        // Restore camera
        world.pointOfView({ lat: 0, lng: 0, altitude: 3.5 }, 1000);
      }
    });

    fetchAllConstellations();
  </script>
</body>
</html>
