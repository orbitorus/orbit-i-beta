<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Orbital Conjunction Analysis Dashboard</title>

  <style>
    :root {
      --bg-main: #0b1020;
      --bg-panel: #121a33;
      --bg-header: #1b254b;
      --border-soft: #26346b;
      --text-main: #e6ebff;
      --text-muted: #9aa4d6;
      --accent: #6ea8ff;
      --accent-glow: rgba(110,168,255,0.45);
    }

    body {
      margin: 0;
      padding: 28px;
      font-family: Inter, Segoe UI, Arial, sans-serif;
      background:
        radial-gradient(circle at 20% 15%, #1a2458 0%, transparent 40%),
        radial-gradient(circle at 80% 10%, #101a40 0%, transparent 45%),
        linear-gradient(180deg, #050816 0%, var(--bg-main) 100%);
      color: var(--text-main);
    }

    h1 {
      margin-bottom: 6px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 13px;
      margin-bottom: 30px;
    }

    .section {
      margin-bottom: 48px;
    }

    .section-title {
      font-size: 18px;
      color: var(--accent);
      margin-bottom: 14px;
    }

    .panel {
      background: var(--bg-panel);
      border: 1px solid var(--border-soft);
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 0 30px rgba(0,0,0,0.45);
    }

    .table-wrapper {
      height: 360px;
      overflow: auto;
      border: 1px solid var(--border-soft);
      border-radius: 10px;
    }


    th {
    white-space: normal;
    text-align: center;
    line-height: 1.2;
    font-size: 12px;
    color: var(--accent);
    }

    input, button {
      background: #0c1330;
      border: 1px solid var(--border-soft);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text-main);
      font-size: 14px;
    }

    button {
      cursor: pointer;
    }

    button:hover {
      border-color: var(--accent);
    }

    /* ===== Section 3 layout ===== */
    .two-column {
      display: grid;
      grid-template-columns: 1fr 1.25fr;
      gap: 24px;
      align-items: stretch;
    }

    /* ===== Image ===== */
    .image-section {
      text-align: center;
    }

    .image-section img {
      width: 95%;
      max-width: 900px;
      border-radius: 16px;
      opacity: 0.75;
      box-shadow:
        0 0 40px rgba(110,168,255,0.18),
        0 0 90px rgba(0,0,0,0.6);
    }

    .plot-container {
      width: 100%;
      height: 420px;
      display: block;
    }
    
    .plot-images {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    
    .plot-images img {
      width: 100%;
      max-width: 100%;
      border-radius: 8px;
      background: #0b1020;
      padding: 6px;
    }

    .gif-sim-container {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 24px;
      align-items: center;
    }
    
    .gif-controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    .gif-controls label {
      display: flex;
      flex-direction: column;
      font-size: 13px;
      color: #cbd5f5;
    }
    
    .gif-controls input {
      margin-top: 4px;
      padding: 6px;
      background: #0b1020;
      border: 1px solid #1e2a55;
      color: white;
      border-radius: 6px;
    }
    
    .gif-controls button {
      margin-top: 10px;
      padding: 10px;
      background: #1e40af;
      border: none;
      color: white;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
    }
    
    .gif-controls button:hover {
      background: #2563eb;
    }
    
    .gif-display img {
      width: 100%;
      border-radius: 10px;
      background: #020617;
      padding: 8px;
    }

    .gif-buttons {
    display: flex;
    gap: 10px;
    }

    #stopBtn {
      background: #7f1d1d;
    }
    
    #stopBtn:hover {
      background: #991b1b;
    }

    
    /* ===== Accordion ===== */
    .accordion-item {
      border-bottom: 1px solid var(--border-soft);
    }

    .accordion-item.active .accordion-content {
      display: block;
    }

    .accordion-header {
      width: 100%;
      text-align: left;
      padding: 14px 18px;
      background: #0b1020;
      color: #e6ecff;
      border: none;
      border-bottom: 1px solid #1c2440;
      cursor: pointer;
      font-size: 16px;
    }
    
    .accordion-header.active {
      background: #121a3a;
    }
    
    .accordion-content {
      display: none;
      padding: 18px;
      background: #0f1428;
      color: #d8defa;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    
  </style>

  
  <script src="https://cdn.plot.ly/plotly-2.30.0.min.js">
    /* ===== Plotly ===== */
  </script>
  
</head>
  
<body>

<h1>Orbital Conjunction Analysis</h1>
<div class="subtitle">
  Inspection · Visualization · Simulation · Scenario Reasoning
</div>

<!-- ================= SECTION 1: CSV INSPECTION ================= -->
<div class="section">
  <div class="section-title">CSV Inspection</div>

  <div class="panel">
    <input
      id="searchInput"
      type="text"
      placeholder="Search conjunctions…"
      disabled
    />

    <div class="status" id="status">
      Type to load and filter CSV
    </div>


    <div class="table-wrapper" style="margin-top:14px; height:360px;">
      <table>
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- ================= SECTION 2: IMAGE ================= -->
<div class="section image-section">
  <div class="section-title">Orbital Context</div>
  <img src="sim_dataset/cpmd_risk_zones.png" alt="risk zones" />
</div>

<!-- ================= SECTION 3: CALCULATION + PLOT ================= -->
<div class="section">
  <div class="section-title">Maneuver Analysis</div>

  <div class="two-column">
    <!-- Left: Calculation -->
    <div class="panel">
  <h3>Maneuver Cost Estimator</h3>
  <p class="subtitle">Simplified analytical model</p>

  <label>Δh (meters)</label><br />
  <input id="dh" type="number" value="100" /><br /><br />

  <label>Satellite mass (kg)</label><br />
  <input id="mass" type="number" value="500" /><br /><br />

  <label>Isp (s)</label><br />
  <input id="isp" type="number" value="1500" /><br /><br />

  <label>Number of maneuvers</label><br />
  <input id="times" type="number" value="10" /><br /><br />

  <label>Base orbit altitude (km)</label><br />
  <input id="orbit" type="number" value="500" /><br /><br />

  <button onclick="computeManeuver(); plotDeltaVvsDeltaH();">
  Compute
  </button>

  
  <div id="calcOutput" style="margin-top:16px; font-size:13px;"></div>
</div>


    <!-- Right: Plot -->
    <div class="panel">
      <!-- Plotly plot goes here -->
      <h3>Visualization</h3>
      <div id="plotly-container" style="height:320px;"></div>
      <!-- Images under plot -->
      <div class="plot-images">
      <img src="sim_dataset/md_cp_vs_tca_dual_axis.png" alt="Image 1">
      <img src="sim_dataset/enhanced_conjunction_polar_plot.png" alt="Image 2">
      </div>
      
    </div>
  </div>
</div>

<!-- ================= SECTION 4: GIF SIMULATION ================= -->
<section class="section">
  <h2>Thruster Maneuver Simulation</h2>

  <div class="gif-sim-container">

    <!-- Controls -->
    <div class="gif-controls">

      <label>
        Thrust (N)
        <input type="number" id="thrustInput" value="0.2" step="0.01">
      </label>

      <label>
        Duration (s)
        <input type="number" id="durationInput" value="120">
      </label>

      <label>
        Timing (s)
        <input type="number" id="timingInput" value="600">
      </label>

      <label>
        Time before TCA (s)
        <input type="number" id="tcaTimeInput" value="3600">
      </label>

      <div class="gif-buttons">
        <button id="simulateBtn">Simulate</button>
        <button id="stopBtn">Stop</button>
      </div>

    </div>

    <!-- GIF display -->
    <div class="gif-display">
      <img
        id="simGif"
        src="sim_dataset/prop_dgtwin.gif"
        alt="Thruster maneuver simulation"
      >
    </div>

  </div>
</section>


<!-- ================= SECTION 5: ACCORDION ================= -->
<section id="scenario-section">
  <h2>Scenarios</h2>

  <div class="accordion">

    <button class="accordion-header" data-md="sim_dataset/scenario_md/Scenario_1_Starlink_Scale_Constellation.md">
      Scenario 1: Starlink-Scale Constellation
    </button>
    <div class="accordion-content"></div>

    <button class="accordion-header" data-md="sim_dataset/scenario_md/Scenario_2_Small_Operator_Medium_Density.md">
      Scenario 2: Small Operator in Medium-Density Shell
    </button>
    <div class="accordion-content"></div>

    <button class="accordion-header" data-md="sim_dataset/scenario_md/Scenario_3_Delayed_Maneuver_Decision.md">
      Scenario 3: Delayed Maneuver Decision
    </button>
    <div class="accordion-content"></div>

    <button class="accordion-header" data-md="sim_dataset/scenario_md/Scenario_4_Systematic_Traffic_Growth.md">
      Scenario 4: Systematic Traffic Growth
    </button>
    <div class="accordion-content"></div>

  </div>
</section>

<script>
/* ================= CSV INSPECTION WITH CAPPED FILTERING ================= */

const CSV_URL =
  "https://raw.githubusercontent.com/orbitorus/orbit-i-beta/main/sim_dataset/selected_conjunction_data.csv";

const DISPLAY_COLUMNS = [
  "conjunction_id",
  "creation_date",
  "tca",
  "miss_distance",
  "relative_speed",
  "collision_probability",
  "object1_object_designator",
  "object1_object_name",
  "object1_international_designator",
  "object1_object_type",
  "object2_object_designator",
  "object2_object_name",
  "object2_international_designator",
  "object2_object_type"
];

const SEARCH_COLUMNS = DISPLAY_COLUMNS;
const INITIAL_RENDER_COUNT = 10;
const MAX_RENDER_COUNT = 100;

let allRows = [];
let dataLoaded = false;

const thead = document.getElementById("thead");
const tbody = document.getElementById("tbody");
const status = document.getElementById("status");
const searchInput = document.getElementById("searchInput");

/* ---------- Utilities ---------- */

function parseCSV(text) {
  const lines = text.trim().split("\n");
  const headers = lines[0].split(",");

  return lines.slice(1).map(line => {
    const values = line.split(",");
    const row = {};
    headers.forEach((h, i) => {
      row[h] = values[i] ?? "";
    });
    return row;
  });
}

function renderHeader() {
  thead.innerHTML = "";
  const tr = document.createElement("tr");

  DISPLAY_COLUMNS.forEach(col => {
    const th = document.createElement("th");
    th.innerHTML = formatHeaderLabel(col);
    tr.appendChild(th);
  });

  thead.appendChild(tr);
}


function formatHeaderLabel(col) {
  const idx = col.indexOf("_");
  if (idx === -1) return col;

  return col.slice(0, idx) + "<br>" + col.slice(idx + 1);
}

function formatValue(column, value) {
  if (value === null || value === undefined || value === "") return value;

  /* ---------- Integer identifiers ---------- */
  if (
    column === "conjunction_id" ||
    column === "object1_object_designator" ||
    column === "object2_object_designator"
  ) {
    return String(parseInt(value, 10));
  }

  /* ---------- Floating metrics ---------- */
  const num = Number(value);
  if (Number.isNaN(num)) return value;

  if (column === "miss_distance") {
    return num.toFixed(2);
  }

  if (column === "relative_speed") {
    return num.toFixed(2);
  }

  if (column === "collision_probability") {
    return num.toExponential(2);
  }

  return value;
}

function renderRows(rows) {
  tbody.innerHTML = "";
  rows.forEach(row => {
    const tr = document.createElement("tr");
    DISPLAY_COLUMNS.forEach(col => {
      const td = document.createElement("td");
      td.textContent = formatValue(col, row[col]);
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
}

/* ---------- Lazy Load ---------- */

async function loadCSVOnce() {
  if (dataLoaded) return;

  status.textContent = "Downloading CSV…";
  searchInput.disabled = true;

  const res = await fetch(CSV_URL);
  const text = await res.text();

  status.textContent = "Parsing CSV…";
  allRows = parseCSV(text);

  renderHeader();
  renderRows(allRows.slice(0, INITIAL_RENDER_COUNT));

  status.textContent =
    `Loaded ${allRows.length.toLocaleString()} rows · showing first ${INITIAL_RENDER_COUNT}`;

  dataLoaded = true;
  searchInput.disabled = false;
}

/* ---------- Filtering (CAPPED) ---------- */

function applyFilter(query) {
  if (!query) {
    renderRows(allRows.slice(0, INITIAL_RENDER_COUNT));
    status.textContent =
      `Loaded ${allRows.length.toLocaleString()} rows · showing first ${INITIAL_RENDER_COUNT}`;
    return;
  }

  const q = query.toLowerCase();
  const matches = [];

  for (const row of allRows) {
    if (
      SEARCH_COLUMNS.some(col =>
        (row[col] || "").toLowerCase().includes(q)
      )
    ) {
      matches.push(row);
      if (matches.length >= MAX_RENDER_COUNT) break;
    }
  }

  renderRows(matches);

  status.textContent =
    `Matches: ${matches.length.toLocaleString()} ` +
    `(showing up to ${MAX_RENDER_COUNT})`;
}

/* ---------- Event Wiring ---------- */

searchInput.disabled = false;
status.textContent = "Type to load and filter CSV";

searchInput.addEventListener("focus", loadCSVOnce);

searchInput.addEventListener("input", e => {
  if (!dataLoaded) {
    loadCSVOnce().then(() => applyFilter(e.target.value));
  } else {
    applyFilter(e.target.value);
  }
});
</script>

<script>
  document.querySelectorAll(".accordion-header").forEach(h => {
    h.addEventListener("click", () => {
      h.parentElement.classList.toggle("active");
    });
  });
</script>

<script>
/* ================= SECTION 3: MANEUVER CALCULATION ================= */

/* ---- Constants ---- */
const MU = 398600.4418;      // km^3/s^2
const R_E = 6378.1363;       // km
const G0 = 9.80665;          // m/s^2

const C_ORBIT_VALUE = 20000; // USD/kg
const KRYPTON_COST = 1200;   // USD/kg
const CHEM_COST = 120;       // USD/kg

const THRUST_SUGGEST = {
  300: 3,
  1500: 0.5,
  2000: 0.2,
  2500: 0.06
};

/* ---- Math Functions ---- */
function hohmannDeltaV(h1_km, h2_km) {
  const r1 = R_E + h1_km;
  const r2 = R_E + h2_km;
  const a = (r1 + r2) / 2;

  const v1 = Math.sqrt(MU / r1);
  const v2 = Math.sqrt(MU / r2);
  const vp = Math.sqrt(MU * (2 / r1 - 1 / a));
  const va = Math.sqrt(MU * (2 / r2 - 1 / a));

  const dv1 = Math.abs(vp - v1) * 1000;
  const dv2 = Math.abs(v2 - va) * 1000;

  return {
    dv1,
    dv2,
    dv_one_way: dv1 + dv2,
    dv_round_trip: 2 * (dv1 + dv2)
  };
}

function propellantMass(m0, isp, deltaV) {
  return m0 * (1 - Math.exp(-deltaV / (isp * G0)));
}

function estimateCost(mp, isp) {
  const fuelCost = isp > 600 ? KRYPTON_COST : CHEM_COST;
  return mp * (fuelCost + C_ORBIT_VALUE);
}

/* ---- Compute Handler ---- */
function computeManeuver() {
  const dh_m = parseFloat(document.getElementById("dh").value);
  const m0 = parseFloat(document.getElementById("mass").value);
  const isp = parseFloat(document.getElementById("isp").value);
  const times = parseInt(document.getElementById("times").value, 10);
  const baseOrbit = parseFloat(document.getElementById("orbit").value);

  if ([dh_m, m0, isp, times, baseOrbit].some(isNaN)) {
    alert("Please fill all inputs with valid numbers.");
    return;
  }

  const dh_km = dh_m / 1000;
  const h2 = baseOrbit + dh_km;

  const dv = hohmannDeltaV(baseOrbit, h2);
  const mpPer = propellantMass(m0, isp, dv.dv_round_trip);

  const totalDv = dv.dv_round_trip * times;
  const totalMp = mpPer * times;
  const totalCost = estimateCost(totalMp, isp);

  const thrust = THRUST_SUGGEST[isp] ?? "N/A";

  document.getElementById("calcOutput").innerHTML = `
    <strong>Per Maneuver</strong><br>
    ΔV burn 1: ${dv.dv1.toFixed(6)} m/s<br>
    ΔV burn 2: ${dv.dv2.toFixed(6)} m/s<br>
    ΔV round trip: ${dv.dv_round_trip.toFixed(6)} m/s<br>
    Propellant: ${mpPer.toFixed(6)} kg<br><br>

    <strong>Total (${times} maneuvers)</strong><br>
    Total ΔV: ${totalDv.toFixed(6)} m/s<br>
    Total propellant: ${totalMp.toFixed(6)} kg<br>
    Estimated cost: $${totalCost.toLocaleString(undefined, {maximumFractionDigits: 2})}<br><br>

    <strong>Thruster</strong><br>
    Isp: ${isp} s<br>
    Suggested thrust: ${thrust} N
  `;
  }
  </script>

  <script>
/* ================= ΔV vs Δh PLOT ================= */

function plotDeltaVvsDeltaH() {
  const baseOrbit = parseFloat(document.getElementById("orbit").value);

  if (isNaN(baseOrbit)) {
    alert("Base orbit altitude is required to plot.");
    return;
  }

  const dhValues = [];
  const dvValues = [];

  // Sweep Δh from 10 m to 2000 m
  for (let dh_m = 10; dh_m <= 2000; dh_m += 10) {
    const dh_km = dh_m / 1000;
    const h2 = baseOrbit + dh_km;

    const dv = hohmannDeltaV(baseOrbit, h2);
    dhValues.push(dh_m);
    dvValues.push(dv.dv_round_trip);
  }

  const trace = {
    x: dhValues,
    y: dvValues,
    mode: "lines",
    line: { width: 3 },
    name: "ΔV (round trip)"
  };

  const layout = {
    title: "ΔV vs Altitude Change (Hohmann Transfer)",
    xaxis: {
      title: "Δh (meters)",
      gridcolor: "#26346b"
    },
    yaxis: {
      title: "ΔV (m/s)",
      gridcolor: "#26346b"
    },
    paper_bgcolor: "rgba(0,0,0,0)",
    plot_bgcolor: "rgba(0,0,0,0)",
    font: {
      color: "#e6ebff"
    },
    margin: { t: 50, l: 60, r: 30, b: 50 }
  };

  Plotly.newPlot("plotly-container", [trace], layout, {
    displayModeBar: false,
    responsive: true
  });
}
</script>

<script>
  const simulateBtn = document.getElementById("simulateBtn");
  const stopBtn = document.getElementById("stopBtn");
  const gif = document.getElementById("simGif");

  simulateBtn.addEventListener("click", () => {
    const thrust = thrustInput.value;
    const duration = durationInput.value;
    const timing = timingInput.value;
    const timeBeforeTCA = tcaTimeInput.value;

    // Force replay
    const baseSrc = "sim_dataset/prop_dgtwin.gif";
    gif.src = "";
    gif.src = baseSrc + "?t=" + Date.now();

    console.log("Simulate:", {
      thrust,
      duration,
      timing,
      timeBeforeTCA
    });
  });

  stopBtn.addEventListener("click", () => {
    // Stop GIF by removing source
    gif.src = "";
    console.log("Simulation stopped");
  });
</script>

<script>
  const headers = document.querySelectorAll(".accordion-header");

  headers.forEach(header => {
    header.addEventListener("click", async () => {
      const content = header.nextElementSibling;
      const mdPath = header.dataset.md;

      const isOpen = header.classList.contains("active");

      // Close all
      headers.forEach(h => {
        h.classList.remove("active");
        h.nextElementSibling.style.display = "none";
      });

      if (isOpen) return;

      header.classList.add("active");
      content.style.display = "block";

      // Load markdown only once
      if (!content.dataset.loaded) {
        content.textContent = "Loading scenario...";
        try {
          const response = await fetch(mdPath);
          const text = await response.text();
          content.textContent = text;
          content.dataset.loaded = "true";
        } catch (err) {
          content.textContent = "Failed to load scenario content.";
        }
      }
    });
  });
</script>


</body>
</html>
