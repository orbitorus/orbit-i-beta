<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Constellation Size Table</title>

  <!-- Tabulator library -->
  <link href="https://unpkg.com/tabulator-tables@5.5.2/dist/css/tabulator.min.css" rel="stylesheet">
  <script src="https://unpkg.com/tabulator-tables@5.5.2/dist/js/tabulator.min.js"></script>

  <style>
    body {
      background: #0b0b0b;
      color: white;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
    }

    h1 {
      text-align: center;
      padding: 20px;
      color: #ffd700;
      text-shadow: 0 0 15px #ffd700;
      font-weight: 600;
    }

    #table-container {
      width: 90%;
      margin: 0 auto 50px auto;
      background: #111;
      border-radius: 10px;
      padding: 15px;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
    }

    /* Header styling */
    .tabulator .tabulator-header .tabulator-col {
      background-color: #002f2f !important;
      color: cyan !important;
      font-weight: bold;
      text-shadow: 0 0 8px rgba(0, 255, 255, 0.8);
      border-right: 1px solid #004d4d !important;
    }

    /* Fix for invisible text: force white text in rows */
    .tabulator .tabulator-row .tabulator-cell {
      color: #ffffff !important;
      background-color: #1a1a1a !important;
    }

    .tabulator .tabulator-row:nth-child(even) .tabulator-cell {
      background-color: #141414 !important;
    }

    .tabulator .tabulator-row:hover .tabulator-cell {
      background-color: rgba(0, 255, 255, 0.1) !important;
    }

    .tabulator .tabulator-row.tabulator-selected .tabulator-cell {
      background-color: rgba(0, 255, 255, 0.25) !important;
    }

    .tabulator .tabulator-header-filter input {
      background: #222 !important;
      color: #fff !important;
      border: 1px solid #00cccc !important;
      padding: 3px;
    }

    .tabulator-footer {
      background-color: #0f0f0f !important;
      color: white !important;
      border-top: 1px solid #00cccc !important;
    }
  </style>
</head>
<body>
  <h1>Constellation Size Sample</h1>
  <div id="table-container"></div>

  <script>
    async function loadCSV(url) {
      const response = await fetch(url);
      const csv = await response.text();

      const rows = csv.trim().split('\n');
      const headers = rows[0].split(',');
      const data = rows.slice(1).map(row => {
        const values = row.split(',');
        const obj = {};
        headers.forEach((header, i) => obj[header.trim()] = values[i]?.trim());
        return obj;
      });

      new Tabulator("#table-container", {
        data: data,
        layout: "fitColumns",
        columns: headers.map(header => ({
          title: header.replace(/"/g, ""),  // removes quotes
          field: header.replace(/"/g, ""),
          headerFilter: "input",
          sorter: "string"
        })),
        pagination: "local",
        paginationSize: 10,
        paginationSizeSelector: [10, 20, 50, 100],
        movableColumns: true,
        resizableColumns: true,
        selectable: true,
        placeholder: "Loading data...",
      });
    }

    loadCSV("https://raw.githubusercontent.com/orbitorus/orbit-i-beta/refs/heads/main/dataset/constellation_size_sample.csv");
  </script>
</body>
</html>
