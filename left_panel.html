<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      color: white;
      margin: 0;
      padding: 0;
      background: transparent;
    }

    h2 {
      text-align: center;
      color: #ffd700;
      text-shadow: 0 0 10px #ffd700, 0 0 20px #ffcc00;
      margin-bottom: 15px;
    }

    #table-container {
      width: 95%;
      margin: 0 auto;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      background-color: #111; /* solid dark background */
      color: cyan; /* readable data text */
      border: 1px solid #00ffff55;
    }

    th {
      background-color: #111;
      color: #ffd700; /* gold header */
      border-bottom: 2px solid #00ffff55;
      padding: 8px;
      text-align: left;
      text-transform: capitalize;
    }

    td {
      padding: 8px;
      border-bottom: 1px solid #00ffff33;
    }

    tr:hover {
      background-color: #222;
    }
  </style>
</head>
<body>
  <h2>Constellation Size Sample</h2>
  <div id="table-container"></div>

  <script>
    const csvUrl = "https://raw.githubusercontent.com/orbitorus/orbit-i-beta/refs/heads/main/dataset/constellation_size_sample.csv";

    fetch(csvUrl)
      .then(res => res.text())
      .then(data => {
        const rows = data.trim().split("\n").map(r => r.split(","));
        const headers = rows[0];
        const table = document.createElement("table");

        const thead = document.createElement("thead");
        const headerRow = document.createElement("tr");
        headers.forEach(h => {
          const th = document.createElement("th");
          th.textContent = h;
          headerRow.appendChild(th);
        });
        thead.appendChild(headerRow);
        table.appendChild(thead);

        const tbody = document.createElement("tbody");
        for (let i = 1; i < rows.length; i++) {
          const row = document.createElement("tr");
          rows[i].forEach(cell => {
            const td = document.createElement("td");
            td.textContent = cell;
            row.appendChild(td);
          });
          tbody.appendChild(row);
        }
        table.appendChild(tbody);

        document.getElementById("table-container").appendChild(table);
      })
      .catch(err => {
        document.getElementById("table-container").innerHTML = `<p style='color:red;'>⚠️ Failed to load CSV data</p>`;
        console.error(err);
      });
  </script>
</body>
</html>
