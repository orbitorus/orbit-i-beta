<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Satellite Constellations Overview</title>
  <style>
    body {
      margin: 0;
      background: black;
      font-family: sans-serif;
      color: white;
      overflow: hidden;
    }

    /* --- Layout --- */
    #top-banner {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 50px;
      background: linear-gradient(to right, #000000, #111122);
      color: #ffd700;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      text-shadow: 0 0 8px #ffd700;
      z-index: 1000;
    }

    #main-content {
      display: flex;
      height: 100vh;
      width: 100%;
      margin-top: 50px;
    }

    /* --- Left Panel --- */
    #left-panel {
      width: 35%;
      background: rgba(0, 0, 0, 0.85);
      overflow-y: auto;
      padding: 20px;
      border-right: 2px solid #333;
    }

    /* --- Right Panel (3D globe, etc.) --- */
    #right-panel {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    /* Scrollbar styling */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-thumb {
      background: #555;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div id="top-banner">Satellite Constellations Overview</div>
  <div id="main-content">
    <div id="left-panel"></div>
    <div id="right-panel">
      <!-- Your globe or visualization scripts go here -->
    </div>
  </div>

  <script>
    // Load the left panel content dynamically
    fetch("left_panel.html")
      .then(response => response.text())
      .then(data => {
        const leftPanel = document.getElementById("left-panel");
        leftPanel.innerHTML = data;

        // Reattach any script tags from left_panel.html
        const scripts = leftPanel.querySelectorAll("script");
        scripts.forEach(oldScript => {
          const newScript = document.createElement("script");
          if (oldScript.src) {
            newScript.src = oldScript.src;
          } else {
            newScript.text = oldScript.textContent;
          }
          document.body.appendChild(newScript);
          oldScript.remove();
        });

        // 🔧 Apply consistent styling for the table after loading left_panel.html
        const styleTag = document.createElement("style");
        styleTag.textContent = `
          #left-panel table {
            width: 100%;
            border-collapse: collapse;
            background-color: #111;
            color: cyan;
            border: 1px solid #00ffff55;
          }
          #left-panel th {
            color: #ffd700;
            border-bottom: 2px solid #00ffff55;
            padding: 8px;
            text-align: left;
          }
          #left-panel td {
            padding: 8px;
            border-bottom: 1px solid #00ffff33;
          }
          #left-panel tr:hover {
            background-color: #222;
          }
          #left-panel h2 {
            text-align: center;
            color: #ffd700;
            text-shadow: 0 0 10px #ffd700, 0 0 20px #ffcc00;
            margin-bottom: 15px;
          }
        `;
        document.head.appendChild(styleTag);
      });
  </script>
</body>
</html>
