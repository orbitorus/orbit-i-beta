<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Satellite Constellations Overview</title>
  <style>
    body { 
      margin: 0; 
      background: black; 
      font-family: 'Segoe UI', Roboto, sans-serif; 
      color: white; 
    }

    /* Top banner (main nav) */
    #top-banner {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 50px;
      background: rgba(40, 40, 40, 0.95);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 20px;
      z-index: 20;
      font-size: 20px;
      font-weight: bold;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
    }

    #top-banner span { flex-shrink: 0; }

    #top-banner a {
      background-color: #1e90ff;
      border: none;
      color: white;
      padding: 6px 14px;
      font-size: 14px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
      text-decoration: none;
    }

    #top-banner a:hover {
      background-color: #63b3ff;
    }

    #top-banner select {
      background-color: #222;
      color: white;
      border: 1px solid #555;
      padding: 5px 10px;
      font-size: 14px;
      border-radius: 4px;
      cursor: pointer;
    }

    /* Orbit button - moved below top banner, right side */
    #orbit-btn {
      position: fixed;
      top: 60px;
      right: 20px;
      background-color: #1e90ff;
      border: none;
      color: white;
      padding: 8px 16px;
      font-size: 15px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
      z-index: 25;
    }

    #orbit-btn:hover:not(:disabled) {
      background-color: #63b3ff;
    }

    #orbit-btn:disabled {
      opacity: 0.4;
      cursor: default;
    }

    /* Info banner, chart, etc. remain same */
    #info-banner {
      position: fixed;
      top: 50px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 900px;
      background: linear-gradient(90deg, rgba(50,50,50,0.9), rgba(20,20,20,0.9));
      color: #e0e0e0;
      text-align: center;
      padding: 14px 20px;
      font-size: 15px;
      border-radius: 8px;
      margin-top: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      opacity: 0;
      z-index: 30;
      transition: opacity 0.8s ease, transform 0.8s ease;
      backdrop-filter: blur(4px);
    }

    #info-banner.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    #info-banner.hide {
      opacity: 0;
      transform: translateX(-50%) translateY(-10px);
    }

    #loading {
      position: fixed;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.1);
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 14px;
      display: none;
      z-index: 15;
    }

    #time-log {
      position: absolute;
      font-size: 12px;
      padding: 5px;
      border-radius: 3px;
      background-color: rgba(200, 200, 200, 0.1);
      color: lavender;
      bottom: 10px;
      right: 10px;
    }

    #chart { width: 100%; height: 100vh; margin-top: 50px; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/globe.gl"></script>
</head>
<body>
  <!-- Top Navigation Banner -->
  <div id="top-banner">
    <span>Major LEO Constellation Visualization</span>

    <select id="constellation-select">
      <option value="all">🌐 All Active Satellites</option>
      <option value="oneweb">🇬🇧 OneWeb</option>
      <option value="kuiper">🇺🇸 Kuiper</option>
      <option value="starlink">🇺🇸 Starlink</option>
      <option value="iridium-NEXT">🇺🇸 Iridium-NEXT</option>
      <option value="hulianwang">🇨🇳 Hulianwang</option>
      <option value="qianfan">🇨🇳 Qianfan</option>
      <option value="planet">🇺🇸 Planet</option>
    </select>

    <div style="margin-left:auto; display:flex; gap:10px;">
      <a href="https://orbitorus.grafana.net/public-dashboards/b8a8e84a4de84bb2b02b57b866dd158d"
         target="_blank"
         rel="noopener noreferrer">
        Track and Monitor
      </a>

      <a href="https://orbitorus.grafana.net/public-dashboards/a983503e27b34b19a1efc0f8f5f4dd9c"
         target="_blank"
         rel="noopener noreferrer">
        Summary Dashboard
      </a>
    </div>
  </div>

  <!-- Orbit Analysis button - now below banner -->
  <button id="orbit-btn" disabled>Orbit Analysis</button>

  <!-- Temporary Info Banner -->
  <div id="info-banner">
    This website helps you in finding apparent anomalous satellites from major mega constellations.<br>
    Select interested constellation from the drop-down list above.
  </div>

  <div id="loading">Loading satellites...</div>
  <div id="chart"></div>
  <div id="time-log"></div>

  <script type="module">
    import * as satellite from 'https://esm.sh/satellite.js';

    const orbitBtn = document.getElementById("orbit-btn");
    const selectEl = document.getElementById("constellation-select");

    let activeConstellation = "all";

    // Disable button for "all", enable for others
    selectEl.addEventListener("change", (e) => {
      activeConstellation = e.target.value;
      orbitBtn.disabled = activeConstellation === "all";
    });

    orbitBtn.addEventListener("click", () => {
      if (!activeConstellation || activeConstellation === "all") return;
      window.location.href = `${activeConstellation}/index2.html`;
    });

    // ... your existing satellite fetching code below ...
  </script>
</body>
</html>
