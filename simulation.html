<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Conjunction Assessment</title>

  <style>
    :root {
      --bg-main: #0b1020;
      --bg-panel: #121a33;
      --bg-table-header: #1b254b;
      --border-soft: #26346b;
      --text-main: #e6ebff;
      --text-muted: #9aa4d6;
      --accent: #6ea8ff;
      --accent-glow: rgba(110, 168, 255, 0.45);
    }

    body {
      margin: 0;
      padding: 32px;
      font-family: "Inter", "Segoe UI", Arial, sans-serif;
      background:
        radial-gradient(circle at 20% 15%, #1a2458 0%, transparent 40%),
        radial-gradient(circle at 80% 10%, #101a40 0%, transparent 45%),
        linear-gradient(180deg, #050816 0%, var(--bg-main) 100%);
      color: var(--text-main);
      min-height: 100vh;
    }

    h1 {
      margin-bottom: 6px;
      font-size: 26px;
    }

    .subtitle {
      color: var(--text-muted);
      margin-bottom: 22px;
      font-size: 14px;
    }

    .panel {
      background: var(--bg-panel);
      border: 1px solid var(--border-soft);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 0 25px rgba(0,0,0,0.4);
    }

    input {
      width: 420px;
      max-width: 100%;
      padding: 10px 14px;
      font-size: 14px;
      border-radius: 8px;
      border: 1px solid var(--border-soft);
      background: #0c1330;
      color: var(--text-main);
      outline: none;
    }

    input::placeholder {
      color: var(--text-muted);
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-glow);
    }

    .status {
      margin-top: 12px;
      font-size: 13px;
      color: var(--text-muted);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 18px;
      font-size: 13px;
    }

    th, td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-soft);
      text-align: left;
      white-space: nowrap;
    }

    th {
      background: var(--bg-table-header);
      color: var(--accent);
      position: sticky;
      top: 0;
      z-index: 1;
    }

    tbody tr:hover {
      background: rgba(110,168,255,0.06);
    }

    tr.hidden {
      display: none;
    }
  </style>
</head>

<body>

<h1>Conjunction CSV Inspector</h1>
<div class="subtitle">
  Multi-column search across CDM / conjunction attributes
</div>

<div class="panel">
  <input
    type="text"
    id="searchInput"
    placeholder="Search conjunction ID, object name, probability, miss distance…"
    disabled
  />

  <div class="status" id="status">Loading CSV…</div>

  <table id="dataTable"></table>
</div>

<script>
  // 🔽 Replace with your RAW GitHub CSV URL
  const CSV_URL =
    "https://raw.githubusercontent.com/orbitorus/orbit-i-beta/refs/heads/main/sim_dataset/selected_conjunction_data.csv";

  const SEARCH_COLUMNS = [
    'conjunction_id',
    'creation_date',
    'tca',
    'miss_distance',
    'relative_speed',
    'collision_probability',
    'object1_object_designator',
    'object1_catalog_name',
    'object1_object_name',
    'object1_international_designator',
    'object1_object_type',
    'object2_object_designator',
    'object2_catalog_name',
    'object2_object_name',
    'object2_international_designator',
    'object2_object_type'
  ];

  const table = document.getElementById("dataTable");
  const searchInput = document.getElementById("searchInput");
  const status = document.getElementById("status");

  let searchColumnIndexes = [];

  fetch(CSV_URL)
    .then(res => {
      if (!res.ok) throw new Error("CSV load failed");
      return res.text();
    })
    .then(csvText => {
      const rows = csvText
        .trim()
        .split("\n")
        .map(r => r.split(","));

      const headers = rows[0].map(h => h.trim());

      // Resolve column indexes dynamically
      searchColumnIndexes = SEARCH_COLUMNS
        .map(col => headers.indexOf(col))
        .filter(idx => idx !== -1);

      if (searchColumnIndexes.length === 0) {
        status.textContent = "Error: none of the search columns found.";
        return;
      }

      // Build table header
      const thead = document.createElement("thead");
      const headerRow = document.createElement("tr");
      headers.forEach(h => {
        const th = document.createElement("th");
        th.textContent = h;
        headerRow.appendChild(th);
      });
      thead.appendChild(headerRow);
      table.appendChild(thead);

      // Build table body
      const tbody = document.createElement("tbody");
      rows.slice(1).forEach(row => {
        const tr = document.createElement("tr");
        row.forEach(cell => {
          const td = document.createElement("td");
          td.textContent = cell;
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);

      status.textContent = `Loaded ${rows.length - 1} conjunctions`;
      searchInput.disabled = false;

      // Multi-column search
      searchInput.addEventListener("input", () => {
        const query = searchInput.value.toLowerCase().trim();

        Array.from(tbody.rows).forEach(row => {
          const match = searchColumnIndexes.some(idx =>
            row.cells[idx]?.textContent.toLowerCase().includes(query)
          );
          row.classList.toggle("hidden", query && !match);
        });
      });
    })
    .catch(err => {
      status.textContent = "Error loading CSV.";
      console.error(err);
    });
</script>

</body>
</html>
