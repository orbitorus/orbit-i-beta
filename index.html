<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Globe View</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: black;
      font-family: sans-serif;
    }

    /* The container holding the globe */
    #globe-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transition: width 0.6s ease;
    }

    /* Side panel container */
    #side-panel {
      position: absolute;
      top: 0;
      right: -50%; /* initially hidden off-screen */
      width: 50%;
      height: 100%;
      background: #111;
      border-left: 2px solid #333;
      transition: right 0.6s ease;
      z-index: 10;
    }

    #side-panel iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Floating button integrated into UI */
    #toggle-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255,255,255,0.3);
      color: white;
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      z-index: 20;
      transition: background 0.3s;
      backdrop-filter: blur(5px);
    }

    #toggle-btn:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    /* When active (panel open) */
    body.panel-open #globe-container {
      width: 50%;
    }
    body.panel-open #side-panel {
      right: 0;
    }
  </style>
</head>
<body>
  <!-- Floating Button -->
  <div id="toggle-btn">☰ Info</div>

  <!-- Globe Container -->
  <div id="globe-container">
    <!-- Your 3D Globe Script -->
    <canvas id="globe"></canvas>
  </div>

  <!-- Sliding Panel -->
  <div id="side-panel">
    <iframe src="index3.html"></iframe>
  </div>

  <script>
    const btn = document.getElementById('toggle-btn');
    btn.addEventListener('click', () => {
      document.body.classList.toggle('panel-open');
    });

    // Example: Initialize globe here (Three.js, etc.)
    // const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('globe') });
    // renderer.setSize(window.innerWidth, window.innerHeight);
  </script>
</body>
</html>
