<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Conjunction CSV Inspector</title>

  <style>
    :root {
      --bg-main: #0b1020;
      --bg-panel: #121a33;
      --bg-table-header: #1b254b;
      --border-soft: #26346b;
      --text-main: #e6ebff;
      --text-muted: #9aa4d6;
      --accent: #6ea8ff;
      --accent-glow: rgba(110, 168, 255, 0.45);
    }

    body {
      margin: 0;
      padding: 28px;
      font-family: Inter, Segoe UI, Arial, sans-serif;
      background:
        radial-gradient(circle at 20% 15%, #1a2458 0%, transparent 40%),
        radial-gradient(circle at 80% 10%, #101a40 0%, transparent 45%),
        linear-gradient(180deg, #050816 0%, var(--bg-main) 100%);
      color: var(--text-main);
      min-height: 100vh;
    }

    h1 {
      font-size: 26px;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 22px;
    }

    /* ===== Section Layout ===== */

    .section {
      margin-bottom: 36px;
    }

    .section-title {
      font-size: 18px;
      margin-bottom: 10px;
      color: var(--accent);
    }

    /* ===== Panel ===== */

    .panel {
      background: var(--bg-panel);
      border: 1px solid var(--border-soft);
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 0 28px rgba(0,0,0,0.45);
    }

    input {
      width: 420px;
      max-width: 100%;
      padding: 10px 14px;
      font-size: 14px;
      border-radius: 8px;
      border: 1px solid var(--border-soft);
      background: #0c1330;
      color: var(--text-main);
      outline: none;
    }

    input::placeholder {
      color: var(--text-muted);
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-glow);
    }

    .status {
      margin-top: 10px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .table-wrapper {
      margin-top: 16px;
      height: 420px;
      overflow: auto;
      border: 1px solid var(--border-soft);
      border-radius: 10px;
    }

    table {
      border-collapse: collapse;
      width: max-content;
      min-width: 100%;
      font-size: 13px;
    }

    th, td {
      padding: 9px 12px;
      border-bottom: 1px solid var(--border-soft);
      white-space: nowrap;
    }

    th {
      position: sticky;
      top: 0;
      background: var(--bg-table-header);
      color: var(--accent);
      z-index: 2;
    }

    tbody tr:hover {
      background: rgba(110,168,255,0.06);
    }

    /* ===== Image Section ===== */

    .image-section {
      text-align: center;
    }

    .image-section img {
      max-width: 900px;
      width: 95%;
      opacity: 0.7;
      border-radius: 16px;
      box-shadow:
        0 0 40px rgba(110,168,255,0.18),
        0 0 90px rgba(0,0,0,0.6);
    }

    .image-caption {
      margin-top: 10px;
      font-size: 12px;
      color: var(--text-muted);
    }
  </style>
</head>

<body>

<h1>Conjunction CSV Inspector</h1>
<div class="subtitle">
  Virtualized rendering · Multi-column filter · Analyst-ready
</div>

<!-- ================= Section 1: CSV Inspector ================= -->

<div class="section">
  <div class="panel">
    <input
      id="searchInput"
      type="text"
      placeholder="Search conjunction ID, object name, probability, miss distance…"
      disabled
    />

    <div class="status" id="status">Loading CSV…</div>

    <div class="table-wrapper" id="tableWrapper">
      <table>
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- ================= Section 2: Visual Context ================= -->

<div class="section image-section">
  <div class="section-title">Dataset Visualization</div>

  <img
    src="https://raw.githubusercontent.com/orbitorus/orbit-i-beta/main/sim_dataset/cpmd_risk_zones.png"
    alt="conjunction context visualization"
  />

  <div class="image-caption">
    Example orbital geometry / conjunction visualization
  </div>
</div>

</html>
