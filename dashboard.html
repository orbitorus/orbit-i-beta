<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orbitorus Satellite Dashboard</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0b0c10;
      color: #c5c6c7;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }

    header {
      position: absolute;
      top: 0;
      width: 100%;
      background-color: #1f2833;
      color: #66fcf1;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
      flex-wrap: wrap;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 600;
    }

    .btn {
      background-color: #45a29e;
      color: #0b0c10;
      border: none;
      padding: 0.6rem 1.2rem;
      font-size: 1rem;
      font-weight: 500;
      border-radius: 8px;
      text-decoration: none;
      transition: all 0.2s ease-in-out;
      cursor: pointer;
      margin-left: 10px;
    }

    .btn:hover {
      background-color: #66fcf1;
      transform: translateY(-2px);
    }

    .content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }

    footer {
      position: absolute;
      bottom: 0;
      text-align: center;
      padding: 0.5rem;
      font-size: 0.9rem;
      color: #666;
      width: 100%;
      background-color: #1f2833;
    }

    @media (max-width: 600px) {
      header {
        flex-direction: column;
        align-items: flex-start;
      }
      header h1 {
        margin-bottom: 0.5rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Orbitorus Satellite Dashboard</h1>
    <a href="index.html" class="btn">Overview</a>
  </header>

  <div class="content">
    <p>The Grafana dashboard cannot be embedded directly due to security restrictions.</p>
    <a href="https://orbitorus.grafana.net/public-dashboards/a983503e27b34b19a1efc0f8f5f4dd9c" 
       target="_blank" 
       rel="noopener noreferrer" 
       class="btn">
      View Satellite Dashboard
    </a>
    <button class="btn" onclick="window.open('https://orbitorus.grafana.net/public-dashboards/a983503e27b34b19a1efc0f8f5f4dd9c', '_blank')">
      Open Dashboard
    </button>
  </div>

  <footer>© 2025 Orbitorus | Powered by Grafana</footer>

</body>
</html>
